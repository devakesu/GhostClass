name: Build Guard

on:
  pull_request:
    branches: [main]

  merge_group:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}
jobs:
  guard:
    name: Build Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify commit is signed
        run: |
          git log -1 --show-signature
