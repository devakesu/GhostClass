name: Build Guard

on:
  pull_request:
    branches: [main]

  merge_group:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}
jobs:
  guard:
    name: Build Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify commit is signed
        run: |
          git log -1 --show-signature
