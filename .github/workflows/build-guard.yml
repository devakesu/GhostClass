name: Build Guard

on:
  pull_request:
    branches: [main]

  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Build Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify commit is signed
        run: |
          git log -1 --show-signature
