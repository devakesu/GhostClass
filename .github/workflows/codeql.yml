name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  codeql-js:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Initialize CodeQL (JS)
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          languages: javascript

      - name: Autobuild (JS)
        uses: github/codeql-action/autobuild@68bde559dea0fdcac2102bfdf6230c5f70eb485e

      - name: Run CodeQL analysis (JS)
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          category: javascript

  codeql-android:
    name: CodeQL Android (Java/Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b622de1dfa918ecc0ab28f40cd42e3c3752cd6c5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: ./.github/actions/flutter-action
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Install Android SDK (basic)
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          api-level: 33
          components: 'platform-tools,build-tools;33.0.2'

      - name: Initialize CodeQL (Java + Kotlin)
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          languages: java-kotlin

      - name: Run Gradle assemble to provide build info
        working-directory: mobile/android
        env:
          FLUTTER_SDK: ${{ env.FLUTTER_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Pci

      - name: Run CodeQL analysis (Android)
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          category: java,kotlin

  codeql-ios:
    name: CodeQL iOS (Swift)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/flutter-action
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Initialize CodeQL (Swift)
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          languages: swift

      - name: Install CocoaPods dependencies (if present)
        if: hashFiles('mobile/ios/Podfile') != ''
        run: |
          sudo gem install cocoapods --no-document
          pushd mobile/ios
          pod install --repo-update || true
          popd

      - name: Build iOS workspace (manual)
        run: |
          set -o pipefail
          xcodebuild -workspace mobile/ios/Runner.xcworkspace -scheme Runner -configuration Debug CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -quiet

      - name: Run CodeQL analysis (Swift)
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          category: swift
