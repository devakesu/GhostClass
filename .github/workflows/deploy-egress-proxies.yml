name: Deploy Egress Proxies

on:
  # Auto-run after successful Release workflow (build/release pipeline)
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Allow manual deployment/testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-cloudflare-worker:
    name: Deploy Cloudflare Worker
    if: |
      github.actor != 'dependabot[bot]' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'

      - name: Validate Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          CF_PROXY_SECRET: ${{ secrets.CF_PROXY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CF_WORKER_NAME}" ] || [ -z "${NEXT_PUBLIC_BACKEND_URL}" ] || [ -z "${CF_PROXY_SECRET}" ]; then
            echo "::warning::Skipping Cloudflare deploy because required credentials/vars are missing."
            echo "Required: secrets.CLOUDFLARE_API_TOKEN, secrets.CLOUDFLARE_ACCOUNT_ID, secrets.CF_PROXY_SECRET, vars.CF_WORKER_NAME, vars.NEXT_PUBLIC_BACKEND_URL"
            exit 0
          fi

      - name: Install Wrangler
        # workers/package-lock.json pins wrangler@4.57.0 with full dependency
        # integrity hashes (SHA-512 SRI). npm ci verifies all hashes before
        # installation, preventing supply-chain substitution attacks.
        run: npm ci --prefix workers

      - name: Update Cloudflare Worker secret (PROXY_SECRET)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CF_PROXY_SECRET: ${{ secrets.CF_PROXY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CF_WORKER_NAME}" ] || [ -z "${CF_PROXY_SECRET}" ]; then
            echo "Skipping Cloudflare secret update (missing credentials/vars)."
            exit 0
          fi
          printf "%s" "${CF_PROXY_SECRET}" | ./workers/node_modules/.bin/wrangler secret put PROXY_SECRET --name "${CF_WORKER_NAME}" --non-interactive

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CF_WORKER_NAME}" ] || [ -z "${NEXT_PUBLIC_BACKEND_URL}" ]; then
            echo "Skipping Cloudflare deploy (missing credentials/vars)."
            exit 0
          fi
          ./workers/node_modules/.bin/wrangler deploy workers/ezygo-proxy/index.js \
            --name "${CF_WORKER_NAME}" \
            --var "EZYGO_API_URL:${NEXT_PUBLIC_BACKEND_URL}" \
            --compatibility-date "2026-02-26"

  deploy-aws-lambda:
    name: Deploy AWS Lambda Proxy
    if: |
      github.actor != 'dependabot[bot]' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate AWS deploy secrets
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SECONDARY_SECRET: ${{ secrets.AWS_SECONDARY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_REGION}" ] || [ -z "${AWS_LAMBDA_FUNCTION_NAME}" ] || [ -z "${NEXT_PUBLIC_BACKEND_URL}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ] || [ -z "${AWS_SECONDARY_SECRET}" ]; then
            echo "::warning::Skipping AWS deploy because required credentials/vars are missing."
            echo "Required: vars.AWS_REGION, vars.AWS_LAMBDA_FUNCTION_NAME, vars.NEXT_PUBLIC_BACKEND_URL, secrets.AWS_ACCESS_KEY_ID, secrets.AWS_SECRET_ACCESS_KEY, secrets.AWS_SECONDARY_SECRET"
            exit 0
          fi

      - name: Configure AWS credentials
        if: vars.AWS_REGION != '' && vars.AWS_LAMBDA_FUNCTION_NAME != '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Lambda environment variables
        env:
          AWS_LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          AWS_SECONDARY_SECRET: ${{ secrets.AWS_SECONDARY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_LAMBDA_FUNCTION_NAME}" ] || [ -z "${NEXT_PUBLIC_BACKEND_URL}" ] || [ -z "${AWS_SECONDARY_SECRET}" ]; then
            echo "Skipping Lambda env update (missing config)."
            exit 0
          fi

          CURRENT_VARS_JSON=$(aws lambda get-function-configuration \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --query 'Environment.Variables' \
            --output json)

          MERGED_VARS_JSON=$(jq -c \
            --arg upstream "${NEXT_PUBLIC_BACKEND_URL}" \
            --arg secret "${AWS_SECONDARY_SECRET}" \
            '. // {} | .EZYGO_API_URL = $upstream | .PROXY_SECRET = $secret | { Variables: . }' \
            <<< "${CURRENT_VARS_JSON}")

          aws lambda update-function-configuration \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --environment "${MERGED_VARS_JSON}"

          aws lambda wait function-updated --function-name "${AWS_LAMBDA_FUNCTION_NAME}"

      - name: Package Lambda source
        run: |
          set -euo pipefail
          cd workers/ezygo-proxy-aws
          zip -q -r ../../ezygo-proxy-aws.zip index.mjs

      - name: Deploy Lambda function code
        env:
          AWS_LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_LAMBDA_FUNCTION_NAME}" ]; then
            echo "Skipping AWS deploy (missing function name)."
            exit 0
          fi

          aws lambda update-function-code \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://ezygo-proxy-aws.zip \
            --publish
