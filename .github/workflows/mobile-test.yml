name: Mobile Tests

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]

permissions: {}

jobs:
  flutter-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Java
        uses: actions/setup-java@b622de1dfa918ecc0ab28f40cd42e3c3752cd6c5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/flutter-action
        with:
          channel: stable
          cache: true

      - name: Prepare app_secrets.dart
        run: cp lib/config/app_secrets.dart.example lib/config/app_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis (Audit)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit tests with coverage
        run: flutter test --coverage

      - name: Enforce minimum code coverage threshold
        env:
          MIN_COVERAGE: "25.0"
        run: |
          set -euo pipefail

          if [ ! -f coverage/lcov.info ]; then
            echo "::error::Coverage file coverage/lcov.info not found."
            exit 1
          fi

          # Compute overall coverage percentage using awk from lcov DA records
          COVERAGE=$(awk -F',' '/^DA:/ { total++; if($2>0) covered++ } END { if(total>0) printf "%.2f", (covered/total)*100; else print "0.00" }' coverage/lcov.info)

          echo "Calculated Mobile Code Coverage: ${COVERAGE}%"
          echo "Required Minimum Coverage: ${MIN_COVERAGE}%"

          # Compare floating point numbers using awk
          PASS=$(awk -v cov="$COVERAGE" -v min="$MIN_COVERAGE" 'BEGIN { if (cov >= min) print "1"; else print "0" }')

          if [ "$PASS" = "0" ]; then
            echo "::error::Code coverage ${COVERAGE}% is below the required minimum threshold of ${MIN_COVERAGE}%."
            exit 1
          else
            echo "✓ Code coverage check passed successfully."
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          files: ./mobile/coverage/lcov.info
          flags: mobile
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
