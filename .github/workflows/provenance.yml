name: Provenance

permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6.0.2

      - name: Record commit
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Repo: $GITHUB_REPOSITORY"
