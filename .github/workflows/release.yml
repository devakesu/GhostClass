name: Release

on:
  workflow_dispatch:
    inputs:
      build_arm64:
        description: "Build ARM64 architecture (slower, ~5min extra)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}
jobs:
  # Initial repository check guard
  guard:
    name: Build Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "."
          trivy-config: "trivy.yaml"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # Build, sign, and push Docker images
  build-and-release:
    name: Build & Release
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      platforms: ${{ steps.prep.outputs.platforms }}
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch build-time variables from Infisical (Unmasked)
        if: env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != ''
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV_SLUG: "prod"
          INFISICAL_SECRET_PATH: "/build-time"
        run: node scripts/fetch-build-time-vars.js
        continue-on-error: true # Gracefully fallback to GitHub native sync variables if action credentials aren't populated yet

      - name: Synchronize workspace versions
        env:
          TARGET_VERSION: ${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION }}
        run: |
          node scripts/sync-version.js "${TARGET_VERSION}"

      - name: Prepare derived values
        id: prep
        env:
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ env.NEXT_PUBLIC_APP_DOMAIN || vars.NEXT_PUBLIC_APP_DOMAIN }}
          ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK: ${{ env.ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK || vars.ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK }}
          NEXT_PUBLIC_BACKEND_URL: ${{ env.NEXT_PUBLIC_BACKEND_URL || vars.NEXT_PUBLIC_BACKEND_URL }}
          EVENT_NAME: ${{ github.event_name }}
          BUILD_ARM64: ${{ github.event.inputs.build_arm64 }}
          HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          # Set APP_DOMAIN with validation; avoid silent localhost fallback for real releases
          APP_DOMAIN="${NEXT_PUBLIC_APP_DOMAIN:-}"
          if [ -z "$APP_DOMAIN" ] || [ "$APP_DOMAIN" = "null" ]; then
            # For non-push events, allow localhost fallback only with explicit opt-in
            if [ "${ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK:-}" != "true" ]; then
              echo "::warning::NEXT_PUBLIC_APP_DOMAIN (repo variable) is not configured. Falling back to APP_DOMAIN=localhost."
              echo "::warning::To explicitly allow this fallback without warnings, set vars.ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK=true."
            fi
            APP_DOMAIN="localhost"
          fi
          echo "APP_DOMAIN=${APP_DOMAIN}" >> $GITHUB_ENV

          # Derive BACKEND_URL if not set
          BACKEND_URL="${NEXT_PUBLIC_BACKEND_URL:-}"
          if [ -z "$BACKEND_URL" ] || [ "$BACKEND_URL" = "null" ]; then
             if [ "$APP_DOMAIN" = "localhost" ]; then
               BACKEND_URL="http://localhost:3000"
             else
               BACKEND_URL="https://${APP_DOMAIN}"
             fi
          fi
          echo "BACKEND_URL=${BACKEND_URL}" >> $GITHUB_ENV
          IMAGE_NAME=$(echo "$REPO" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

          # Debug: Show what will be used
          echo "🐳 Image name: ${IMAGE_NAME}"
          echo "   Full path: ghcr.io/${REPO_OWNER}/${IMAGE_NAME}"

          # Determine build platforms
          # Default to amd64 for faster, more reliable release builds.
          # ARM64 remains available as an explicit manual opt-in.
          if [ "${EVENT_NAME}" == "push" ]; then
            PLATFORMS="linux/amd64"
            echo "📦 Main push detected - building amd64 only"
          elif [ "${EVENT_NAME}" == "workflow_dispatch" ]; then
            if [ "${BUILD_ARM64}" == "true" ]; then
              PLATFORMS="linux/amd64,linux/arm64"
              echo "📦 Manual dispatch with ARM64 enabled"
            else
              PLATFORMS="linux/amd64"
              echo "📦 Manual dispatch - AMD64 only (faster build)"
            fi
          else
            # Default fallback
            PLATFORMS="linux/amd64"
          fi
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo "  Build platforms: ${PLATFORMS}"

          echo "app_url=https://${APP_DOMAIN}" >> $GITHUB_OUTPUT
          echo "sitemap_url=https://${APP_DOMAIN}/sitemap.xml" >> $GITHUB_OUTPUT
          echo "app_email=@${APP_DOMAIN}" >> $GITHUB_OUTPUT
          echo "legal_email=legal@${APP_DOMAIN}" >> $GITHUB_OUTPUT
          # Use a consistent timestamp for reproducibility
          TIMESTAMP="${HEAD_COMMIT_TIMESTAMP:-}"
          if [ -z "$TIMESTAMP" ] || [ "$TIMESTAMP" == "null" ]; then
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "created=$TIMESTAMP" >> $GITHUB_OUTPUT

          # SOURCE_DATE_EPOCH: use the Unix timestamp of the checked-out commit.
          # This makes Docker layer timestamps deterministic per commit.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "source_date_epoch=${SOURCE_DATE_EPOCH}" >> $GITHUB_OUTPUT
          echo "🕒 SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH}"

      - name: Build & push Docker image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}:${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}:latest
          secrets: |
            sentry_token=${{ env.SENTRY_AUTH_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          platforms: ${{ steps.prep.outputs.platforms }}
          # Enable layer caching for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.prep.outputs.source_date_epoch }}
            NEXT_PUBLIC_BACKEND_URL=${{ env.NEXT_PUBLIC_BACKEND_URL || vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_CF_PROXY_URL=${{ env.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL || vars.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL }}
            NEXT_PUBLIC_SUPABASE_AWS_PROXY_URL=${{ env.NEXT_PUBLIC_SUPABASE_AWS_PROXY_URL || vars.NEXT_PUBLIC_SUPABASE_AWS_PROXY_URL }}
            NEXT_PUBLIC_GITHUB_URL=${{ env.NEXT_PUBLIC_GITHUB_URL || vars.NEXT_PUBLIC_GITHUB_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN || vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.NEXT_PUBLIC_TURNSTILE_SITE_KEY || vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GA_ID=${{ env.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_ANDROID_PACKAGE_NAME=${{ env.NEXT_PUBLIC_ANDROID_PACKAGE_NAME || vars.NEXT_PUBLIC_ANDROID_PACKAGE_NAME }}
            NEXT_PUBLIC_ANDROID_SHA256_FINGERPRINTS=${{ env.NEXT_PUBLIC_ANDROID_SHA256_FINGERPRINTS || vars.NEXT_PUBLIC_ANDROID_SHA256_FINGERPRINTS }}
            SENTRY_ORG=${{ env.SENTRY_ORG || vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ env.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
            NEXT_PUBLIC_APP_NAME=${{ env.NEXT_PUBLIC_APP_NAME || vars.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_APP_VERSION=${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}
            MIN_APP_VERSION=${{ env.MIN_APP_VERSION || vars.MIN_APP_VERSION || 'latest' }}
            NEXT_PUBLIC_APP_DOMAIN=${{ env.NEXT_PUBLIC_APP_DOMAIN || vars.NEXT_PUBLIC_APP_DOMAIN }}
            NEXT_PUBLIC_AUTHOR_NAME=${{ env.NEXT_PUBLIC_AUTHOR_NAME || vars.NEXT_PUBLIC_AUTHOR_NAME }}
            NEXT_PUBLIC_AUTHOR_URL=${{ env.NEXT_PUBLIC_AUTHOR_URL || vars.NEXT_PUBLIC_AUTHOR_URL }}
            NEXT_PUBLIC_APP_URL=${{ steps.prep.outputs.app_url }}
            NEXT_PUBLIC_SITEMAP_URL=${{ steps.prep.outputs.sitemap_url }}
            NEXT_PUBLIC_APP_EMAIL=${{ steps.prep.outputs.app_email }}
            NEXT_PUBLIC_LEGAL_EMAIL=${{ steps.prep.outputs.legal_email }}
            NEXT_PUBLIC_DONATE_URL=${{ env.NEXT_PUBLIC_DONATE_URL || vars.NEXT_PUBLIC_DONATE_URL }}
            NEXT_PUBLIC_DEFAULT_DOMAIN=${{ env.NEXT_PUBLIC_DEFAULT_DOMAIN || vars.NEXT_PUBLIC_DEFAULT_DOMAIN }}
            NEXT_PUBLIC_ATTENDANCE_TARGET_MIN=${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_MIN || vars.NEXT_PUBLIC_ATTENDANCE_TARGET_MIN }}
            NEXT_PUBLIC_SENTRY_REPLAY_RATE=${{ env.NEXT_PUBLIC_SENTRY_REPLAY_RATE || vars.NEXT_PUBLIC_SENTRY_REPLAY_RATE }}
            NEXT_PUBLIC_FORCE_STRICT_CSP=${{ env.NEXT_PUBLIC_FORCE_STRICT_CSP || vars.NEXT_PUBLIC_FORCE_STRICT_CSP }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_RUN_ID=${{ github.run_id }}
            GITHUB_RUN_NUMBER=${{ github.run_number }}
            BUILD_TIMESTAMP=${{ steps.prep.outputs.created }}
            AUDIT_STATUS=PASSED
            SIGNATURE_STATUS=SLSA_PROVENANCE_GENERATED
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.version=${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}

      # Build and push the Database Backup container image
      - name: Build & push Backup Docker image
        id: build-push-backup
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: backup/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ghostclass-backup:${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}
            ghcr.io/${{ github.repository_owner }}/ghostclass-backup:latest
          platforms: ${{ steps.prep.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.version=${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}

      # Attest build provenance
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Download SLSA provenance attestation for OpenSSF Scorecard
      - name: Download SLSA provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Downloading SLSA Provenance Attestation ==="

          # Retry logic: attestation may take a moment to be available
          MAX_ATTEMPTS=5
          ATTEMPT=1
          SLEEP_TIME=10

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            if gh attestation download \
              oci://ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }} \
              --owner ${{ github.repository_owner }}; then
              shopt -s nullglob
              digest_files=(sha256*.jsonl)
              if [ ${#digest_files[@]} -gt 0 ]; then
                DIGEST_FILE="${digest_files[0]}"
              else
                DIGEST_FILE=""
              fi
              if [ -n "$DIGEST_FILE" ]; then
                mv "$DIGEST_FILE" provenance.intoto.jsonl
                echo "✓ SLSA provenance attestation downloaded successfully"
                ls -lh provenance.intoto.jsonl
                exit 0
              else
                echo "⚠ Could not find downloaded attestation file"
                echo "Current directory contents:"
                ls -la
                echo "Waiting ${SLEEP_TIME}s before retry..."
                sleep $SLEEP_TIME
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
            else
              echo "⚠ Download failed, waiting ${SLEEP_TIME}s before retry..."
              sleep $SLEEP_TIME
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          echo "❌ Failed to download attestation after $MAX_ATTEMPTS attempts"
          exit 1

      # Generate SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.json

      # Attest SBOM
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: sbom.json
          push-to-registry: true

      # Sign image with cosign (keyless signing using OIDC)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Authenticate cosign with registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          echo "${GH_TOKEN}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
          IMAGE_URI: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail

          echo "=== Cosign Image Signing ==="
          echo "Image URI: ${IMAGE_URI}"
          VERSION="${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}"
          echo "Version: ${VERSION}"

          # Sign with timeout
          timeout 300 cosign sign \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.ref }}" \
            -a "version=${VERSION}" \
            "${IMAGE_URI}" || {
              echo "ERROR: Cosign image signing failed or timed out"
              exit 1
            }

          echo "✓ Image signed successfully"
          cosign triangulate "${IMAGE_URI}"

      - name: Verify image signature
        env:
          IMAGE_URI: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail

          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

          echo "✓ Image signature verified"

      # Sign SBOM file
      - name: Sign SBOM artifact
        run: |
          set -euo pipefail

          echo "=== Signing SBOM ==="
          timeout 60 cosign sign-blob --yes \
            --bundle sbom.json.bundle \
            sbom.json || {
              echo "ERROR: SBOM signing failed or timed out"
              exit 1
            }

          echo "✓ SBOM signed successfully"

      # Generate SHA256 checksums (after all artifacts are created)
      - name: Generate checksums
        run: |
          echo "# Release Artifact Checksums" > checksums.txt
          echo "" >> checksums.txt
          echo "## SBOM" >> checksums.txt
          sha256sum sbom.json >> checksums.txt
          echo "" >> checksums.txt
          echo "## Signature Bundle" >> checksums.txt
          sha256sum sbom.json.bundle >> checksums.txt
          echo "" >> checksums.txt
          echo "## SLSA Provenance Attestation" >> checksums.txt
          sha256sum provenance.intoto.jsonl >> checksums.txt
          echo "" >> checksums.txt
          echo "Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> checksums.txt
          echo "" >> checksums.txt
          cat checksums.txt

      # Upload artifacts for the release job
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-release-artifacts
          path: |
            sbom.json
            sbom.json.bundle
            checksums.txt
            provenance.intoto.jsonl

  build-mobile:
    name: Build Flutter Android
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Gradle Wrapper
        run: |
          mkdir -p mobile/android/gradle/wrapper
          curl -fSL -o mobile/android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.6.1/gradle/wrapper/gradle-wrapper.jar
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  mobile/android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Flutter
        uses: ./.github/actions/flutter-action
        with:
          channel: stable
          cache: true

      - name: Fetch build-time variables from Infisical (Unmasked)
        if: env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != ''
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV_SLUG: "prod"
          INFISICAL_SECRET_PATH: "/build-time"
        run: node scripts/fetch-build-time-vars.js
        continue-on-error: true # Gracefully fallback to GitHub native sync variables if action credentials aren't populated yet

      - name: Synchronize workspace versions
        env:
          TARGET_VERSION: ${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION }}
        run: |
          node scripts/sync-version.js "${TARGET_VERSION}"

      - name: Prepare mobile release paths
        id: mobile-prep
        run: |
          set -euo pipefail

          mkdir -p mobile/release-assets

          echo "build_name=${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          BUILD_TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          if [ -z "$BUILD_TIMESTAMP" ] || [ "$BUILD_TIMESTAMP" = "null" ]; then
            BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"

          # Derive APP_DOMAIN and BACKEND_URL
          APP_DOMAIN="${{ env.NEXT_PUBLIC_APP_DOMAIN || vars.NEXT_PUBLIC_APP_DOMAIN }}"
          if [ -z "$APP_DOMAIN" ] || [ "$APP_DOMAIN" = "null" ]; then
            APP_DOMAIN="localhost"
          fi
          echo "APP_DOMAIN=${APP_DOMAIN}" >> $GITHUB_ENV

          BACKEND_URL="${{ env.NEXT_PUBLIC_BACKEND_URL || vars.NEXT_PUBLIC_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ] || [ "$BACKEND_URL" = "null" ]; then
             if [ "$APP_DOMAIN" = "localhost" ]; then
               BACKEND_URL="http://localhost:3000"
             else
               BACKEND_URL="https://${APP_DOMAIN}"
             fi
          fi
          echo "BACKEND_URL=${BACKEND_URL}" >> $GITHUB_ENV

      - name: Fetch Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Prepare Android signing key
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"

          [ -n "$ANDROID_KEYSTORE_BASE64" ] && echo "::add-mask::$ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] && echo "::add-mask::$ANDROID_KEY_ALIAS"
          [ -n "$ANDROID_KEY_PASSWORD" ] && echo "::add-mask::$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ghostclass.p12

          cat > key.properties << EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=ghostclass.p12
          storeType=pkcs12
          EOF

          chmod 600 key.properties ghostclass.p12

      - name: Prepare google-services.json
        working-directory: mobile/android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ env.GOOGLE_SERVICES_JSON_BASE64 || secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          set +x

          : "${GOOGLE_SERVICES_JSON_BASE64:?GOOGLE_SERVICES_JSON_BASE64 environment variable or secret is required}"

          [ -n "$GOOGLE_SERVICES_JSON_BASE64" ] && echo "::add-mask::$GOOGLE_SERVICES_JSON_BASE64"

          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

          # Derive dynamic API key directly from the decoded file if not set manually
          if [ -z "${FIREBASE_API_KEY_ANDROID:-}" ]; then
            DERIVED_KEY=$(jq -r '.client[0].api_key[0].current_key // empty' app/google-services.json)
            if [ -n "$DERIVED_KEY" ]; then
              echo "FIREBASE_API_KEY_ANDROID=$DERIVED_KEY" >> "$GITHUB_ENV"
              echo "✓ Derived FIREBASE_API_KEY_ANDROID directly from google-services.json"
            fi
          fi

          if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
            DERIVED_PROJECT_ID=$(jq -r '.project_info.project_id // empty' app/google-services.json)
            if [ -n "$DERIVED_PROJECT_ID" ]; then
              echo "FIREBASE_PROJECT_ID=$DERIVED_PROJECT_ID" >> "$GITHUB_ENV"
              echo "✓ Derived FIREBASE_PROJECT_ID directly from google-services.json"
            fi
          fi

          if [ -z "${FIREBASE_MESSAGING_SENDER_ID:-}" ]; then
            DERIVED_SENDER_ID=$(jq -r '.project_info.project_number // empty' app/google-services.json)
            if [ -n "$DERIVED_SENDER_ID" ]; then
              echo "FIREBASE_MESSAGING_SENDER_ID=$DERIVED_SENDER_ID" >> "$GITHUB_ENV"
              echo "✓ Derived FIREBASE_MESSAGING_SENDER_ID directly from google-services.json"
            fi
          fi

          if [ -z "${FIREBASE_STORAGE_BUCKET:-}" ]; then
            DERIVED_BUCKET=$(jq -r '.project_info.storage_bucket // empty' app/google-services.json)
            if [ -n "$DERIVED_BUCKET" ]; then
              echo "FIREBASE_STORAGE_BUCKET=$DERIVED_BUCKET" >> "$GITHUB_ENV"
              echo "✓ Derived FIREBASE_STORAGE_BUCKET directly from google-services.json"
            fi
          fi

          if [ -z "${FIREBASE_ANDROID_APP_ID:-}" ]; then
            DERIVED_APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id // empty' app/google-services.json)
            if [ -n "$DERIVED_APP_ID" ]; then
              echo "FIREBASE_ANDROID_APP_ID=$DERIVED_APP_ID" >> "$GITHUB_ENV"
              echo "✓ Derived FIREBASE_ANDROID_APP_ID directly from google-services.json"
            fi
          fi

          if [ -z "${ANDROID_PACKAGE_NAME:-}" ]; then
            DERIVED_PKG=$(jq -r '.client[0].client_info.android_client_info.package_name // empty' app/google-services.json)
            if [ -n "$DERIVED_PKG" ]; then
              echo "ANDROID_PACKAGE_NAME=$DERIVED_PKG" >> "$GITHUB_ENV"
              echo "✓ Derived ANDROID_PACKAGE_NAME directly from google-services.json"
            fi
          fi

      - name: Generate mobile/lib/config/app_secrets.dart
        working-directory: mobile
        env:
          SUPABASE_URL_PROD: ${{ env.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY_PROD: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_CF_PROXY_URL_PROD: ${{ env.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL || vars.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL }}
          SENTRY_DSN: ${{ env.NEXT_PUBLIC_MOBILE_SENTRY_DSN || vars.NEXT_PUBLIC_MOBILE_SENTRY_DSN || env.NEXT_PUBLIC_SENTRY_DSN || vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          set -euo pipefail

          # Resolve values from GITHUB_ENV (exported in previous step)
          APP_DOMAIN="${APP_DOMAIN:-ghostclass.devakesu.com}"
          BACKEND_URL="${BACKEND_URL:-https://${APP_DOMAIN}}"

          # Helper to treat "null" string as empty and apply fallback
          safe_val() {
            local val="$1"
            local fallback="$2"
            if [ -z "$val" ] || [ "$val" = "null" ]; then
              echo -n "$fallback"
            else
              echo -n "$val"
            fi
          }

          # Encode all sensitive strings to Base64 for uniform obfuscation
          # Fallbacks ensure no empty strings or "null" literals are baked in
          S_PROXY=$(safe_val "$SUPABASE_CF_PROXY_URL_PROD" "$SUPABASE_URL_PROD")
          ENCODED_SUPABASE_PROXY_URL_PROD=$(echo -n "$S_PROXY" | base64 | tr -d '\n')
          ENCODED_SUPABASE_ANON_KEY_PROD=$(echo -n "$(safe_val "$SUPABASE_ANON_KEY_PROD" "")" | base64 | tr -d '\n')
          ENCODED_SENTRY_DSN=$(echo -n "$(safe_val "$SENTRY_DSN" "")" | base64 | tr -d '\n')
          ENCODED_GHOSTCLASS_API_URL_PROD=$(echo -n "https://${APP_DOMAIN}/api" | base64 | tr -d '\n')
          ENCODED_EZYGO_AUTH_URL=$(echo -n "$(safe_val "$BACKEND_URL" "https://${APP_DOMAIN}")/login" | base64 | tr -d '\n')
          ENCODED_EZYGO_API_ROOT=$(echo -n "$(safe_val "$BACKEND_URL" "https://${APP_DOMAIN}")" | base64 | tr -d '\n')
          ENCODED_EZYGO_ORIGIN=$(echo -n "https://edu.ezygo.app" | base64 | tr -d '\n')

          cat > lib/config/app_secrets.dart << EOF
          import 'package:flutter/foundation.dart';

          class AppSecrets {
            AppSecrets._();

            // Forced to false for production release builds
            static const bool isDev = false;

            // Dev credentials stripped for production security
            static const String supabaseUrlDev = '';
            static const String supabasePublishableKeyDev = '';

            static const String supabaseProxyUrlProd = '${ENCODED_SUPABASE_PROXY_URL_PROD}';
            static const String supabasePublishableKeyProd = '${ENCODED_SUPABASE_ANON_KEY_PROD}';

            static const String sentryDsn = '${ENCODED_SENTRY_DSN}';

            static const String ghostclassApiUrlDev = '';
            static const String ghostclassApiUrlProd = '${ENCODED_GHOSTCLASS_API_URL_PROD}';

            static const String ezygoAuthUrl = '${ENCODED_EZYGO_AUTH_URL}';
            static const String ezygoApiRoot = '${ENCODED_EZYGO_API_ROOT}';
            static const String ezygoOrigin = '${ENCODED_EZYGO_ORIGIN}';
          }
          EOF

      - name: Build Android APK
        working-directory: mobile
        env:
          BUILD_TIMESTAMP: ${{ steps.mobile-prep.outputs.build_timestamp }}
          SENTRY_AUTH_TOKEN: ${{ env.MOBILE_SENTRY_AUTH_TOKEN || secrets.MOBILE_SENTRY_AUTH_TOKEN || env.SENTRY_AUTH_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          APP_DOMAIN: ${{ env.APP_DOMAIN }}
          APP_NAME: ${{ env.APP_NAME || env.NEXT_PUBLIC_APP_NAME || vars.APP_NAME || vars.NEXT_PUBLIC_APP_NAME }}
          AUTHOR_NAME: ${{ env.AUTHOR_NAME || env.NEXT_PUBLIC_AUTHOR_NAME || vars.AUTHOR_NAME || vars.NEXT_PUBLIC_AUTHOR_NAME }}
          AUTHOR_URL: ${{ env.AUTHOR_URL || env.NEXT_PUBLIC_AUTHOR_URL || vars.AUTHOR_URL || vars.NEXT_PUBLIC_AUTHOR_URL }}
          GITHUB_URL: ${{ env.GITHUB_URL || env.NEXT_PUBLIC_GITHUB_URL || vars.GITHUB_URL || vars.NEXT_PUBLIC_GITHUB_URL }}
          DONATE_URL: ${{ env.DONATE_URL || env.NEXT_PUBLIC_DONATE_URL || vars.DONATE_URL || vars.NEXT_PUBLIC_DONATE_URL }}
          ANDROID_PACKAGE_NAME: ${{ env.ANDROID_PACKAGE_NAME || env.NEXT_PUBLIC_ANDROID_PACKAGE_NAME || vars.ANDROID_PACKAGE_NAME || vars.NEXT_PUBLIC_ANDROID_PACKAGE_NAME }}
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY_ANDROID: ${{ env.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_ANDROID_APP_ID: ${{ env.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ env.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ env.FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail

          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)

          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json \
            --build-name="${{ steps.mobile-prep.outputs.build_name }}" \
            --build-number="${{ steps.mobile-prep.outputs.build_number }}" \
            --dart-define=APP_VERSION="${{ steps.mobile-prep.outputs.build_name }}" \
            --dart-define=APP_COMMIT_SHA=${{ github.sha }} \
            --dart-define=BUILD_TIMESTAMP=${BUILD_TIMESTAMP} \
            --dart-define=GITHUB_RUN_ID=${{ github.run_id }} \
            --dart-define=GITHUB_RUN_NUMBER=${{ github.run_number }} \
            --dart-define=APP_DOMAIN="${APP_DOMAIN}" \
            --dart-define=APP_NAME="${APP_NAME:-}" \
            --dart-define=AUTHOR_NAME="${AUTHOR_NAME:-}" \
            --dart-define=AUTHOR_URL="${AUTHOR_URL:-}" \
            --dart-define=GITHUB_URL="${GITHUB_URL:-}" \
            --dart-define=DONATE_URL="${DONATE_URL:-}" \
            --dart-define=ANDROID_PACKAGE_NAME="${ANDROID_PACKAGE_NAME:-}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID:-}" \
            --dart-define=FIREBASE_API_KEY_ANDROID="${FIREBASE_API_KEY_ANDROID:-}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${FIREBASE_ANDROID_APP_ID:-}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${FIREBASE_MESSAGING_SENDER_ID:-}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${FIREBASE_STORAGE_BUCKET:-}"

          dart run sentry_dart_plugin

      - name: Build Android App Bundle
        working-directory: mobile
        env:
          BUILD_TIMESTAMP: ${{ steps.mobile-prep.outputs.build_timestamp }}
          APP_DOMAIN: ${{ env.APP_DOMAIN }}
          APP_NAME: ${{ env.APP_NAME || env.NEXT_PUBLIC_APP_NAME || vars.APP_NAME || vars.NEXT_PUBLIC_APP_NAME }}
          AUTHOR_NAME: ${{ env.AUTHOR_NAME || env.NEXT_PUBLIC_AUTHOR_NAME || vars.AUTHOR_NAME || vars.NEXT_PUBLIC_AUTHOR_NAME }}
          AUTHOR_URL: ${{ env.AUTHOR_URL || env.NEXT_PUBLIC_AUTHOR_URL || vars.AUTHOR_URL || vars.NEXT_PUBLIC_AUTHOR_URL }}
          GITHUB_URL: ${{ env.GITHUB_URL || env.NEXT_PUBLIC_GITHUB_URL || vars.GITHUB_URL || vars.NEXT_PUBLIC_GITHUB_URL }}
          DONATE_URL: ${{ env.DONATE_URL || env.NEXT_PUBLIC_DONATE_URL || vars.DONATE_URL || vars.NEXT_PUBLIC_DONATE_URL }}
          ANDROID_PACKAGE_NAME: ${{ env.ANDROID_PACKAGE_NAME || env.NEXT_PUBLIC_ANDROID_PACKAGE_NAME || vars.ANDROID_PACKAGE_NAME || vars.NEXT_PUBLIC_ANDROID_PACKAGE_NAME }}
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY_ANDROID: ${{ env.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_ANDROID_APP_ID: ${{ env.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ env.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ env.FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail

          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)

          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json \
            --build-name="${{ steps.mobile-prep.outputs.build_name }}" \
            --build-number="${{ steps.mobile-prep.outputs.build_number }}" \
            --dart-define=APP_VERSION="${{ steps.mobile-prep.outputs.build_name }}" \
            --dart-define=APP_COMMIT_SHA=${{ github.sha }} \
            --dart-define=BUILD_TIMESTAMP=${BUILD_TIMESTAMP} \
            --dart-define=GITHUB_RUN_ID=${{ github.run_id }} \
            --dart-define=GITHUB_RUN_NUMBER=${{ github.run_number }} \
            --dart-define=APP_DOMAIN="${APP_DOMAIN}" \
            --dart-define=APP_NAME="${APP_NAME:-}" \
            --dart-define=AUTHOR_NAME="${AUTHOR_NAME:-}" \
            --dart-define=AUTHOR_URL="${AUTHOR_URL:-}" \
            --dart-define=GITHUB_URL="${GITHUB_URL:-}" \
            --dart-define=DONATE_URL="${DONATE_URL:-}" \
            --dart-define=ANDROID_PACKAGE_NAME="${ANDROID_PACKAGE_NAME:-}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID:-}" \
            --dart-define=FIREBASE_API_KEY_ANDROID="${FIREBASE_API_KEY_ANDROID:-}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${FIREBASE_ANDROID_APP_ID:-}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${FIREBASE_MESSAGING_SENDER_ID:-}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${FIREBASE_STORAGE_BUCKET:-}"

      - name: Generate mobile SBOM
        working-directory: mobile
        run: |
          set -euo pipefail

          # Unset credential-like variables to prevent environment audit exposure warnings during SBOM generation
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN \
                INFISICAL_CLIENT_SECRET \
                MOBILE_SENTRY_AUTH_TOKEN \
                NEXT_PUBLIC_APP_EMAIL \
                NEXT_PUBLIC_LEGAL_EMAIL \
                NEXT_PUBLIC_SUPABASE_DEV_PUBLISHABLE_KEY \
                NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
                NEXT_PUBLIC_TURNSTILE_SITE_KEY \
                SENTRY_AUTH_TOKEN

          npx --yes @cyclonedx/cdxgen -t dart --no-install-deps -o release-assets/mobile-sbom.json .

      - name: Attest mobile APK provenance
        id: attest-mobile
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Attest mobile AAB provenance
        id: attest-mobile-aab
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Assemble mobile release assets
        working-directory: mobile
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-mobile.outputs.bundle-path }}
          VERSION_NAME: ${{ steps.mobile-prep.outputs.build_name }}
        run: |
          set -euo pipefail

          cp build/app/outputs/flutter-apk/app-release.apk release-assets/ghostclass-android-v${VERSION_NAME}.apk
          cp "$ATTESTATION_BUNDLE" release-assets/mobile-provenance.intoto.jsonl

          cd release-assets
          {
            echo "# Mobile Release Artifact Checksums"
            echo ""
            sha256sum ghostclass-android-v${VERSION_NAME}.apk
            sha256sum mobile-sbom.json
            sha256sum mobile-provenance.intoto.jsonl
            echo ""
            echo "Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > mobile-checksums.txt

      - name: Upload mobile APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ghostclass-android-apk-v${{ steps.mobile-prep.outputs.build_name }}
          path: mobile/release-assets/ghostclass-android-v${{ steps.mobile-prep.outputs.build_name }}.apk

      - name: Upload mobile security metadata artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-release-artifacts
          path: |
            mobile/release-assets/mobile-sbom.json
            mobile/release-assets/mobile-provenance.intoto.jsonl
            mobile/release-assets/mobile-checksums.txt

      - name: Assemble Play Console internal assets
        working-directory: mobile
        env:
          AAB_ATTESTATION_BUNDLE: ${{ steps.attest-mobile-aab.outputs.bundle-path }}
        run: |
          set -euo pipefail

          mkdir -p play-console-assets
          cp build/app/outputs/bundle/release/app-release.aab play-console-assets/mobile-app-release.aab
          cp "$AAB_ATTESTATION_BUNDLE" play-console-assets/aab-provenance.intoto.jsonl

          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt play-console-assets/mapping.txt
          else
            echo "mapping.txt not found, skipping"
          fi

          cd play-console-assets
          {
            echo "# Play Console Internal Artifact Checksums"
            echo ""
            sha256sum mobile-app-release.aab
            sha256sum aab-provenance.intoto.jsonl
            [ -f mapping.txt ] && sha256sum mapping.txt || true
            echo ""
            echo "Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > play-console-checksums.txt

      - name: Upload Play Console internal assets to Private S3 Storage
        working-directory: mobile/play-console-assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          AWS_S3_PRIVATE_BUCKET: ${{ secrets.AWS_S3_PRIVATE_BUCKET || vars.AWS_S3_PRIVATE_BUCKET }}
          BUILD_NAME: ${{ steps.mobile-prep.outputs.build_name }}
        run: |
          set -euo pipefail
          set +x

          [ -n "$AWS_SECRET_ACCESS_KEY" ] && echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          [ -n "$AWS_ACCESS_KEY_ID" ] && echo "::add-mask::$AWS_ACCESS_KEY_ID"

          if [ -z "${AWS_S3_PRIVATE_BUCKET:-}" ]; then
            echo "::warning::AWS_S3_PRIVATE_BUCKET is not configured. Internal artifacts (.aab, mapping.txt) will not be archived to cloud storage."
            echo "::warning::To enable secure private storage, populate the AWS_S3_PRIVATE_BUCKET secret."
            exit 0
          fi

          echo "Uploading private internal release assets to s3://${AWS_S3_PRIVATE_BUCKET}/releases/v${BUILD_NAME}/"

          aws s3 cp . "s3://${AWS_S3_PRIVATE_BUCKET}/releases/v${BUILD_NAME}/" --recursive

          echo "✓ Internal artifacts securely archived to private S3 bucket"

  # Create GitHub Release with artifacts
  create-github-release:
    name: Create GitHub Release
    needs: [build-and-release, build-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch build-time variables from Infisical (Unmasked)
        if: env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != ''
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV_SLUG: "prod"
          INFISICAL_SECRET_PATH: "/build-time"
        run: node scripts/fetch-build-time-vars.js
        continue-on-error: true

      - name: Determine release version
        id: version
        env:
          APP_VERSION: ${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}
        run: |
          VERSION="${APP_VERSION}"
          if [[ "${VERSION}" != v* ]]; then
            VERSION_TAG="v${VERSION}"
          else
            VERSION_TAG="${VERSION}"
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "Targeting release tag: ${VERSION_TAG}"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-release-artifacts
          path: ./artifacts/web

      - name: Download mobile APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ghostclass-android-apk-v${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}
          path: ./artifacts/mobile

      - name: Download mobile security metadata artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: android-release-artifacts
          path: ./artifacts/mobile

      - name: Verify downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -maxdepth 2 -type f | sort
          echo ""
          echo "Checksums:"
          cat ./artifacts/web/checksums.txt
          echo ""
          cat ./artifacts/mobile/mobile-checksums.txt

      - name: Calculate previous version for changelog
        id: prev_version
        env:
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          # Get the previous semantic version tag (strict pattern matching)
          PREV_TAG=$(git tag -l 'v*.*.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${VERSION_TAG}$" | head -n1 || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "No previous version tag found, using initial commit"
            PREV_REF=$(git rev-list --max-parents=0 HEAD)
            echo "changelog_text=${PREV_REF}...${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "Previous tag: ${PREV_TAG}"
            echo "changelog_text=${PREV_TAG}...${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate verification instructions
        env:
          PLATFORMS: ${{ needs.build-and-release.outputs.platforms }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          DIGEST: ${{ needs.build-and-release.outputs.image_digest }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          # Derive image name from repository name
          IMAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')

          # Convert platforms to readable format
          PLATFORM_LIST=$(echo "${PLATFORMS}" | sed 's/linux\///g; s/,/, /g')

          cat > ./artifacts/VERIFY.md << EOF
          # Release Verification Instructions

          This release includes signed web and mobile artifacts with attestations for supply chain security.

          ## Verify Docker Image Signature

          Using cosign (keyless verification):

          \`\`\`bash
          cosign verify \\
            --certificate-identity-regexp="^https://github.com/${REPOSITORY}" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}
          \`\`\`

          ## Verify Build Attestation

          Using GitHub CLI:

          \`\`\`bash
          gh attestation verify oci://ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG} --owner ${REPOSITORY_OWNER}
          \`\`\`

          ## Verify SBOM Signature

          Using cosign:

          \`\`\`bash
          cosign verify-blob \\
            --bundle sbom.json.bundle \\
            sbom.json
          \`\`\`

          ## Verify Checksums

          Download the checksums file and verify the artifacts:

          \`\`\`bash
          # Verify all artifacts (extract only checksum lines)
          grep -E '^[0-9a-f]{64}  ' checksums.txt | sha256sum -c

          # Or verify individual files
          sha256sum sbom.json sbom.json.bundle
          \`\`\`

          ## Verify Mobile APK

          \`\`\`bash
          gh attestation verify ghostclass-android-v${VERSION}.apk --owner ${REPOSITORY_OWNER}
          grep -E '^[0-9a-f]{64}  ' mobile-checksums.txt | sha256sum -c
          \`\`\`

          ## Image Information

          - **Image**: \`ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}\`
          - **Digest**: \`${DIGEST}\`
          - **Platforms**: \`${PLATFORM_LIST}\`
          - **Version**: \`${VERSION}\`

          ## Additional Tags

          This release is also available under the following tags:
          - \`ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:latest\`
          - \`ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION}\`

          ## Learn More

          - [Sigstore Cosign Documentation](https://docs.sigstore.dev/cosign/overview/)
          - [GitHub Attestations Documentation](https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds)
          - [SBOM Overview](https://www.cisa.gov/sbom)
          EOF

      - name: Create GitHub Release
        env:
          DIGEST: ${{ needs.build-and-release.outputs.image_digest }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION_RAW: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
          CHANGELOG_TEXT: ${{ steps.prev_version.outputs.changelog_text }}
          PLATFORMS: ${{ needs.build-and-release.outputs.platforms }}
          ANDROID_PACKAGE_NAME: ${{ env.NEXT_PUBLIC_ANDROID_PACKAGE_NAME || vars.NEXT_PUBLIC_ANDROID_PACKAGE_NAME || 'com.devakesu.apps.ghostclass' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          IMAGE_NAME=$(echo "$REPOSITORY" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          PLATFORM_LIST=$(echo "${PLATFORMS}" | sed 's/linux\///g; s/,/, /g')
          PLAY_STORE_URL="https://play.google.com/store/apps/details?id=${ANDROID_PACKAGE_NAME}"

          if [[ "${PLATFORMS}" == *","* ]]; then
            PLATFORM_DESC="Multi-platform Docker images (${PLATFORM_LIST})"
          else
            PLATFORM_DESC="Docker image (${PLATFORM_LIST})"
          fi

          cat > ./artifacts/RELEASE_NOTES.md << EOF
          ## Release ${VERSION_TAG}

          This release includes:
          - 🐳 ${PLATFORM_DESC}
          - 📱 Flutter Android APK with provenance attestation
          - 🔐 Signed images and artifacts using Sigstore cosign
          - 📋 Software Bill of Materials (SBOM) in CycloneDX format
          - ✅ Build provenance attestations
          - 🔍 SHA256 checksums for all artifacts

          ### Mobile App

          [![Get it on Google Play](https://img.shields.io/badge/Get%20it%20on-Google%20Play-34A853?style=for-the-badge&logo=googleplay&logoColor=white)](${PLAY_STORE_URL})

          **Google Play**: ${PLAY_STORE_URL}

          > We recommend downloading from Google Play. GhostClass enforces Firebase App Check (Play Integrity), and Play-distributed builds provide the most reliable attestation path.

          ### Docker Images

          \`\`\`bash
          docker pull ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}
          \`\`\`

          **Image Digest**: \`${DIGEST}\`

          ### Verification

          See [VERIFY.md](https://github.com/${REPOSITORY}/releases/download/${VERSION_TAG}/VERIFY.md) for detailed verification instructions.

          ### Quick Verification

          \`\`\`bash
          # Verify image signature
          cosign verify \\
            --certificate-identity-regexp="^https://github.com/${REPOSITORY}" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}

          # Verify attestation
          gh attestation verify oci://ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG} --owner ${REPOSITORY_OWNER}
          \`\`\`

          ---

          **Full Changelog**: ${SERVER_URL}/${REPOSITORY}/compare/${CHANGELOG_TEXT}
          EOF

          # Remove leading indentation from here-doc
          sed -i 's/^[[:space:]]\{10\}//' ./artifacts/RELEASE_NOTES.md

          gh release create "${VERSION_TAG}" \
            --title "Release ${VERSION_TAG}" \
            --latest \
            --notes-file ./artifacts/RELEASE_NOTES.md \
            ./artifacts/web/sbom.json \
            ./artifacts/web/sbom.json.bundle \
            ./artifacts/web/checksums.txt \
            ./artifacts/VERIFY.md \
            ./artifacts/web/provenance.intoto.jsonl \
            ./artifacts/mobile/ghostclass-android-v${VERSION_RAW}.apk \
            ./artifacts/mobile/mobile-sbom.json \
            ./artifacts/mobile/mobile-checksums.txt \
            ./artifacts/mobile/mobile-provenance.intoto.jsonl \
            --draft=false
