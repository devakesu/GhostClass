name: Release

on:
  workflow_dispatch:
    inputs:
      build_arm64:
        description: "Build ARM64 architecture (slower, ~5min extra)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Initial repository check guard
  guard:
    name: Build Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6.0.2

  # Build, sign, and push Docker images
  build-and-release:
    name: Build & Release
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
      platforms: ${{ steps.prep.outputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@a0c73a10bb6782f082cd6714666c87911e4fc7d3 # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@9f4a8ea54ed9055d5f86c993e1f2ffa674f98344 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch build-time secrets from Infisical
        uses: infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "production"
          secret-path: "/build-time"
        continue-on-error: true # Gracefully fallback to GitHub native sync variables if action credentials aren't populated yet

      - name: Prepare derived values
        id: prep
        env:
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Set APP_DOMAIN with validation; avoid silent localhost fallback for real releases
          APP_DOMAIN="${{ env.NEXT_PUBLIC_APP_DOMAIN || vars.NEXT_PUBLIC_APP_DOMAIN }}"
          if [ -z "$APP_DOMAIN" ] || [ "$APP_DOMAIN" = "null" ]; then
            # For non-push events, allow localhost fallback only with explicit opt-in
            if [ "${{ env.ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK || vars.ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK }}" != "true" ]; then
              echo "::warning::NEXT_PUBLIC_APP_DOMAIN (repo variable) is not configured. Falling back to APP_DOMAIN=localhost."
              echo "::warning::To explicitly allow this fallback without warnings, set vars.ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK=true."
            fi
            APP_DOMAIN="localhost"
          fi
          IMAGE_NAME=$(echo "$REPO" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

          # Debug: Show what will be used
          echo "🐳 Image name: ${IMAGE_NAME}"
          echo "   Full path: ghcr.io/${REPO_OWNER}/${IMAGE_NAME}"

          # Determine build platforms
          # For main pushes: Build both AMD64 and ARM64 (full release)
          # For workflow_dispatch: Respect user's build_arm64 input
          if [ "${{ github.event_name }}" == "push" ]; then
            # Push - always build multi-arch for full releases
            PLATFORMS="linux/amd64,linux/arm64"
            echo "📦 Main push detected - building multi-architecture"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.build_arm64 }}" == "true" ]; then
              PLATFORMS="linux/amd64,linux/arm64"
              echo "📦 Manual dispatch with ARM64 enabled"
            else
              PLATFORMS="linux/amd64"
              echo "📦 Manual dispatch - AMD64 only (faster build)"
            fi
          else
            # Default fallback
            PLATFORMS="linux/amd64"
          fi
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo "  Build platforms: ${PLATFORMS}"

          echo "app_url=https://${APP_DOMAIN}" >> $GITHUB_OUTPUT
          echo "sitemap_url=https://${APP_DOMAIN}/sitemap.xml" >> $GITHUB_OUTPUT
          echo "app_email=@${APP_DOMAIN}" >> $GITHUB_OUTPUT
          echo "legal_email=legal@${APP_DOMAIN}" >> $GITHUB_OUTPUT
          # Use a consistent timestamp for reproducibility
          TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          if [ -z "$TIMESTAMP" ] || [ "$TIMESTAMP" == "null" ]; then
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "created=$TIMESTAMP" >> $GITHUB_OUTPUT

          # SOURCE_DATE_EPOCH: use the Unix timestamp of the checked-out commit.
          # This makes Docker layer timestamps deterministic per commit.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "source_date_epoch=${SOURCE_DATE_EPOCH}" >> $GITHUB_OUTPUT
          echo "🕒 SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH}"

      - name: Build & push Docker image
        id: build-push
        uses: docker/build-push-action@789f68658055d3ca993799b232b5c46dfe3f114d # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}:${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}:latest
          secrets: |
            sentry_token=${{ env.SENTRY_AUTH_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          platforms: ${{ steps.prep.outputs.platforms }}
          # Enable layer caching for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.prep.outputs.source_date_epoch }}
            NEXT_PUBLIC_BACKEND_URL=${{ env.NEXT_PUBLIC_BACKEND_URL || vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_DEV_URL=${{ env.NEXT_PUBLIC_SUPABASE_DEV_URL || vars.NEXT_PUBLIC_SUPABASE_DEV_URL }}
            NEXT_PUBLIC_SUPABASE_DEV_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_DEV_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_DEV_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_CF_PROXY_URL=${{ env.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL || vars.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL }}
            NEXT_PUBLIC_SUPABASE_AWS_PROXY_URL=${{ env.NEXT_PUBLIC_SUPABASE_AWS_PROXY_URL || vars.NEXT_PUBLIC_SUPABASE_AWS_PROXY_URL }}
            NEXT_PUBLIC_GITHUB_URL=${{ env.NEXT_PUBLIC_GITHUB_URL || vars.NEXT_PUBLIC_GITHUB_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN || vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.NEXT_PUBLIC_TURNSTILE_SITE_KEY || vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GA_ID=${{ env.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_ANDROID_PACKAGE_NAME=${{ env.NEXT_PUBLIC_ANDROID_PACKAGE_NAME || vars.NEXT_PUBLIC_ANDROID_PACKAGE_NAME }}
            SENTRY_ORG=${{ env.SENTRY_ORG || vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ env.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
            NEXT_PUBLIC_APP_NAME=${{ env.NEXT_PUBLIC_APP_NAME || vars.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_APP_VERSION=${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}
            NEXT_PUBLIC_APP_DOMAIN=${{ env.NEXT_PUBLIC_APP_DOMAIN || vars.NEXT_PUBLIC_APP_DOMAIN }}
            NEXT_PUBLIC_AUTHOR_NAME=${{ env.NEXT_PUBLIC_AUTHOR_NAME || vars.NEXT_PUBLIC_AUTHOR_NAME }}
            NEXT_PUBLIC_AUTHOR_URL=${{ env.NEXT_PUBLIC_AUTHOR_URL || vars.NEXT_PUBLIC_AUTHOR_URL }}
            NEXT_PUBLIC_APP_URL=${{ steps.prep.outputs.app_url }}
            NEXT_PUBLIC_SITEMAP_URL=${{ steps.prep.outputs.sitemap_url }}
            NEXT_PUBLIC_APP_EMAIL=${{ steps.prep.outputs.app_email }}
            NEXT_PUBLIC_LEGAL_EMAIL=${{ steps.prep.outputs.legal_email }}
            NEXT_PUBLIC_DONATE_URL=${{ env.NEXT_PUBLIC_DONATE_URL || vars.NEXT_PUBLIC_DONATE_URL }}
            NEXT_PUBLIC_DEFAULT_DOMAIN=${{ env.NEXT_PUBLIC_DEFAULT_DOMAIN || vars.NEXT_PUBLIC_DEFAULT_DOMAIN }}
            NEXT_PUBLIC_ATTENDANCE_TARGET_MIN=${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_MIN || vars.NEXT_PUBLIC_ATTENDANCE_TARGET_MIN }}
            NEXT_PUBLIC_SENTRY_REPLAY_RATE=${{ env.NEXT_PUBLIC_SENTRY_REPLAY_RATE || vars.NEXT_PUBLIC_SENTRY_REPLAY_RATE }}
            NEXT_PUBLIC_FORCE_STRICT_CSP=${{ env.NEXT_PUBLIC_FORCE_STRICT_CSP || vars.NEXT_PUBLIC_FORCE_STRICT_CSP }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_RUN_ID=${{ github.run_id }}
            GITHUB_RUN_NUMBER=${{ github.run_number }}
            BUILD_TIMESTAMP=${{ steps.prep.outputs.created }}
            AUDIT_STATUS=PASSED
            SIGNATURE_STATUS=SLSA_PROVENANCE_GENERATED
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.version=${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}

      # Attest build provenance
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@10334b5f1e684784025c3fc0a277c88c19089275 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Download SLSA provenance attestation for OpenSSF Scorecard
      - name: Download SLSA provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Downloading SLSA Provenance Attestation ==="

          # Retry logic: attestation may take a moment to be available
          MAX_ATTEMPTS=5
          ATTEMPT=1
          SLEEP_TIME=10

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            if gh attestation download \
              oci://ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }} \
              --owner ${{ github.repository_owner }}; then
              shopt -s nullglob
              digest_files=(sha256*.jsonl)
              if [ ${#digest_files[@]} -gt 0 ]; then
                DIGEST_FILE="${digest_files[0]}"
              else
                DIGEST_FILE=""
              fi
              if [ -n "$DIGEST_FILE" ]; then
                mv "$DIGEST_FILE" provenance.intoto.jsonl
                echo "✓ SLSA provenance attestation downloaded successfully"
                ls -lh provenance.intoto.jsonl
                exit 0
              else
                echo "⚠ Could not find downloaded attestation file"
                echo "Current directory contents:"
                ls -la
                echo "Waiting ${SLEEP_TIME}s before retry..."
                sleep $SLEEP_TIME
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
            else
              echo "⚠ Download failed, waiting ${SLEEP_TIME}s before retry..."
              sleep $SLEEP_TIME
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          echo "❌ Failed to download attestation after $MAX_ATTEMPTS attempts"
          exit 1

      # Generate SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@cf54b07f9a24febf56b236893d115bafc5be6a27 # v0.23.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.json

      # Attest SBOM
      - name: Attest SBOM
        uses: actions/attest@a2d48ba168b9e64b41c8cc6fa3b9a90ee277d34f # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: sbom.json
          push-to-registry: true

      # Sign image with cosign (keyless signing using OIDC)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.0

      - name: Authenticate cosign with registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
          IMAGE_URI: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail

          echo "=== Cosign Image Signing ==="
          echo "Image URI: ${IMAGE_URI}"
          VERSION="${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}"
          echo "Version: ${VERSION}"

          # Sign with timeout
          timeout 300 cosign sign \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.ref }}" \
            -a "version=${VERSION}" \
            "${IMAGE_URI}" || {
              echo "ERROR: Cosign image signing failed or timed out"
              exit 1
            }

          echo "✓ Image signed successfully"
          cosign triangulate "${IMAGE_URI}"

      - name: Verify image signature
        env:
          IMAGE_URI: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail

          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

          echo "✓ Image signature verified"

      # Sign SBOM file
      - name: Sign SBOM artifact
        run: |
          set -euo pipefail

          echo "=== Signing SBOM ==="
          timeout 60 cosign sign-blob --yes \
            --bundle sbom.json.bundle \
            sbom.json || {
              echo "ERROR: SBOM signing failed or timed out"
              exit 1
            }

          echo "✓ SBOM signed successfully"

      # Generate SHA256 checksums (after all artifacts are created)
      - name: Generate checksums
        run: |
          echo "# Release Artifact Checksums" > checksums.txt
          echo "" >> checksums.txt
          echo "## SBOM" >> checksums.txt
          sha256sum sbom.json >> checksums.txt
          echo "" >> checksums.txt
          echo "## Signature Bundle" >> checksums.txt
          sha256sum sbom.json.bundle >> checksums.txt
          echo "" >> checksums.txt
          echo "## SLSA Provenance Attestation" >> checksums.txt
          sha256sum provenance.intoto.jsonl >> checksums.txt
          echo "" >> checksums.txt
          echo "Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> checksums.txt
          echo "" >> checksums.txt
          cat checksums.txt

      # Upload artifacts for the release job
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-artifacts
          path: |
            sbom.json
            sbom.json.bundle
            checksums.txt
            provenance.intoto.jsonl

  build-mobile:
    name: Build Flutter Android
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch build-time secrets from Infisical
        uses: infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "production"
          secret-path: "/build-time"
        continue-on-error: true # Gracefully fallback to GitHub native sync variables if action credentials aren't populated yet

      - name: Prepare mobile release paths
        id: mobile-prep
        run: |
          set -euo pipefail

          mkdir -p mobile/release-assets

          echo "build_name=${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          BUILD_TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          if [ -z "$BUILD_TIMESTAMP" ] || [ "$BUILD_TIMESTAMP" = "null" ]; then
            BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Fetch Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Prepare Android signing key
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"

          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_ALIAS"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ghostclass.p12

          cat > key.properties << EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=ghostclass.p12
          storeType=pkcs12
          EOF

          chmod 600 key.properties ghostclass.p12

      - name: Generate mobile/lib/config/app_secrets.dart
        working-directory: mobile
        env:
          SUPABASE_URL_PROD: ${{ env.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY_PROD: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL_DEV: ${{ env.NEXT_PUBLIC_SUPABASE_DEV_URL || vars.NEXT_PUBLIC_SUPABASE_DEV_URL }}
          SUPABASE_ANON_KEY_DEV: ${{ env.NEXT_PUBLIC_SUPABASE_DEV_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_DEV_PUBLISHABLE_KEY }}
          SUPABASE_CF_PROXY_URL_PROD: ${{ env.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL || vars.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL }}
          SENTRY_DSN: ${{ env.NEXT_PUBLIC_MOBILE_SENTRY_DSN || vars.NEXT_PUBLIC_MOBILE_SENTRY_DSN || env.NEXT_PUBLIC_SENTRY_DSN || vars.NEXT_PUBLIC_SENTRY_DSN }}
          BACKEND_URL: ${{ env.NEXT_PUBLIC_BACKEND_URL || vars.NEXT_PUBLIC_BACKEND_URL }}
          APP_DOMAIN: ${{ env.NEXT_PUBLIC_APP_DOMAIN || vars.NEXT_PUBLIC_APP_DOMAIN }}
        run: |
          set -euo pipefail

          # Encode all sensitive strings to Base64 for uniform obfuscation
          ENCODED_SUPABASE_URL_DEV=$(echo -n "$SUPABASE_URL_DEV" | base64 | tr -d '\n')
          ENCODED_SUPABASE_ANON_KEY_DEV=$(echo -n "$SUPABASE_ANON_KEY_DEV" | base64 | tr -d '\n')
          ENCODED_SUPABASE_PROXY_URL_PROD=$(echo -n "${SUPABASE_CF_PROXY_URL_PROD:-$SUPABASE_URL_PROD}" | base64 | tr -d '\n')
          ENCODED_SUPABASE_ANON_KEY_PROD=$(echo -n "$SUPABASE_ANON_KEY_PROD" | base64 | tr -d '\n')
          ENCODED_SENTRY_DSN=$(echo -n "$SENTRY_DSN" | base64 | tr -d '\n')
          ENCODED_EZYGO_AUTH_URL=$(echo -n "${BACKEND_URL}/login" | base64 | tr -d '\n')
          ENCODED_EZYGO_API_ROOT=$(echo -n "$BACKEND_URL" | base64 | tr -d '\n')
          ENCODED_EZYGO_ORIGIN=$(echo -n "https://edu.ezygo.app" | base64 | tr -d '\n')

          GHOSTCLASS_API_URL="https://${APP_DOMAIN}/api"

          cat > lib/config/app_secrets.dart << EOF
          import 'package:flutter/foundation.dart';

          class AppSecrets {
            AppSecrets._();

            static const bool isDev = kDebugMode;

            static const String supabaseUrlDev = '${ENCODED_SUPABASE_URL_DEV}';
            static const String supabasePublishableKeyDev = '${ENCODED_SUPABASE_ANON_KEY_DEV}';

            static const String supabaseProxyUrlProd = '${ENCODED_SUPABASE_PROXY_URL_PROD}';
            static const String supabasePublishableKeyProd = '${ENCODED_SUPABASE_ANON_KEY_PROD}';

            static const String sentryDsn = '${ENCODED_SENTRY_DSN}';

            static const String ghostclassApiUrlDev = '';

            static const String ghostclassApiUrlProd = '${GHOSTCLASS_API_URL}';

            static const String ezygoAuthUrl = '${ENCODED_EZYGO_AUTH_URL}';
            static const String ezygoApiRoot = '${ENCODED_EZYGO_API_ROOT}';
            static const String ezygoOrigin = '${ENCODED_EZYGO_ORIGIN}';
          }
          EOF

      - name: Build Android APK
        working-directory: mobile
        env:
          BUILD_TIMESTAMP: ${{ steps.mobile-prep.outputs.build_timestamp }}
          SENTRY_AUTH_TOKEN: ${{ env.MOBILE_SENTRY_AUTH_TOKEN || secrets.MOBILE_SENTRY_AUTH_TOKEN || env.SENTRY_AUTH_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)

          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json \
            --build-name="${{ steps.mobile-prep.outputs.build_name }}" \
            --build-number="${{ steps.mobile-prep.outputs.build_number }}" \
            --dart-define=APP_VERSION="${{ steps.mobile-prep.outputs.build_name }}" \
            --dart-define=APP_COMMIT_SHA=${{ github.sha }} \
            --dart-define=BUILD_TIMESTAMP=${BUILD_TIMESTAMP} \
            --dart-define=GITHUB_RUN_ID=${{ github.run_id }} \
            --dart-define=GITHUB_RUN_NUMBER=${{ github.run_number }}

          dart run sentry_dart_plugin

      - name: Generate mobile SBOM
        working-directory: mobile
        run: |
          set -euo pipefail

          npx --yes @cyclonedx/cdxgen -t dart --no-install-deps -o release-assets/mobile-sbom.json .

      - name: Attest mobile APK provenance
        id: attest-mobile
        uses: actions/attest-build-provenance@10334b5f1e684784025c3fc0a277c88c19089275 # v4.1.0
        with:
          subject-path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Assemble mobile release assets
        working-directory: mobile
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-mobile.outputs.bundle-path }}
        run: |
          set -euo pipefail

          cp build/app/outputs/flutter-apk/app-release.apk release-assets/mobile-app-release.apk
          cp "$ATTESTATION_BUNDLE" release-assets/mobile-provenance.intoto.jsonl

          cd release-assets
          {
            echo "# Mobile Release Artifact Checksums"
            echo ""
            sha256sum mobile-app-release.apk
            sha256sum mobile-sbom.json
            sha256sum mobile-provenance.intoto.jsonl
            echo ""
            echo "Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > mobile-checksums.txt

      - name: Upload mobile release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: mobile-release-artifacts
          path: |
            mobile/release-assets/mobile-app-release.apk
            mobile/release-assets/mobile-sbom.json
            mobile/release-assets/mobile-provenance.intoto.jsonl
            mobile/release-assets/mobile-checksums.txt

  # Create GitHub Release with artifacts
  create-github-release:
    name: Create GitHub Release
    needs: [build-and-release, build-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch build-time secrets from Infisical
        uses: infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "production"
          secret-path: "/build-time"
        continue-on-error: true

      - name: Determine release version
        id: version
        run: |
          VERSION="${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}"
          if [[ "${VERSION}" != v* ]]; then
            VERSION_TAG="v${VERSION}"
          else
            VERSION_TAG="${VERSION}"
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "Targeting release tag: ${VERSION_TAG}"

      - name: Download artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: release-artifacts
          path: ./artifacts/web

      - name: Download mobile artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: mobile-release-artifacts
          path: ./artifacts/mobile

      - name: Verify downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -maxdepth 2 -type f | sort
          echo ""
          echo "Checksums:"
          cat ./artifacts/web/checksums.txt
          echo ""
          cat ./artifacts/mobile/mobile-checksums.txt

      - name: Calculate previous version for changelog
        id: prev_version
        env:
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          # Get the previous semantic version tag (strict pattern matching)
          PREV_TAG=$(git tag -l 'v*.*.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${VERSION_TAG}$" | head -n1 || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "No previous version tag found, using initial commit"
            PREV_REF=$(git rev-list --max-parents=0 HEAD)
            echo "changelog_text=${PREV_REF}...${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "Previous tag: ${PREV_TAG}"
            echo "changelog_text=${PREV_TAG}...${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate verification instructions
        env:
          PLATFORMS: ${{ needs.build-and-release.outputs.platforms }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          DIGEST: ${{ needs.build-and-release.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          # Derive image name from repository name
          IMAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')

          # Convert platforms to readable format
          PLATFORM_LIST=$(echo "${PLATFORMS}" | sed 's/linux\///g; s/,/, /g')

          cat > ./artifacts/VERIFY.md << EOF
          # Release Verification Instructions

          This release includes signed web and mobile artifacts with attestations for supply chain security.

          ## Verify Docker Image Signature

          Using cosign (keyless verification):

          \`\`\`bash
          cosign verify \\
            --certificate-identity-regexp="^https://github.com/${REPOSITORY}" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}
          \`\`\`

          ## Verify Build Attestation

          Using GitHub CLI:

          \`\`\`bash
          gh attestation verify oci://ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG} --owner ${REPOSITORY_OWNER}
          \`\`\`

          ## Verify SBOM Signature

          Using cosign:

          \`\`\`bash
          cosign verify-blob \\
            --bundle sbom.json.bundle \\
            sbom.json
          \`\`\`

          ## Verify Checksums

          Download the checksums file and verify the artifacts:

          \`\`\`bash
          # Verify all artifacts (extract only checksum lines)
          grep -E '^[0-9a-f]{64}  ' checksums.txt | sha256sum -c

          # Or verify individual files
          sha256sum sbom.json sbom.json.bundle
          \`\`\`

          ## Verify Mobile APK

          \`\`\`bash
          gh attestation verify mobile-app-release.apk --owner ${REPOSITORY_OWNER}
          grep -E '^[0-9a-f]{64}  ' mobile-checksums.txt | sha256sum -c
          \`\`\`

          ## Image Information

          - **Image**: \`ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}\`
          - **Digest**: \`${DIGEST}\`
          - **Platforms**: \`${PLATFORM_LIST}\`
          - **Version**: \`${VERSION}\`

          ## Additional Tags

          This release is also available under the following tags:
          - \`ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:latest\`
          - \`ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION}\`

          ## Learn More

          - [Sigstore Cosign Documentation](https://docs.sigstore.dev/cosign/overview/)
          - [GitHub Attestations Documentation](https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds)
          - [SBOM Overview](https://www.cisa.gov/sbom)
          EOF

      - name: Create GitHub Release
        env:
          DIGEST: ${{ needs.build-and-release.outputs.digest }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
          CHANGELOG_TEXT: ${{ steps.prev_version.outputs.changelog_text }}
          PLATFORMS: ${{ needs.build-and-release.outputs.platforms }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          PLATFORM_LIST=$(echo "${PLATFORMS}" | sed 's/linux\///g; s/,/, /g')

          if [[ "${PLATFORMS}" == *","* ]]; then
            PLATFORM_DESC="Multi-platform Docker images (${PLATFORM_LIST})"
          else
            PLATFORM_DESC="Docker image (${PLATFORM_LIST})"
          fi

          gh release create "${VERSION_TAG}" \
            --title "Release ${VERSION_TAG}" \
            --latest \
            --notes "## Release ${VERSION_TAG}

          This release includes:
          - 🐳 ${PLATFORM_DESC}
          - 📱 Flutter Android APK with provenance attestation
          - 🔐 Signed images and artifacts using Sigstore cosign
          - 📋 Software Bill of Materials (SBOM) in CycloneDX format
          - ✅ Build provenance attestations
          - 🔍 SHA256 checksums for all artifacts

          ### Docker Images

          \`\`\`bash
          docker pull ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}
          \`\`\`

          **Image Digest**: \`${DIGEST}\`

          ### Verification

          See [VERIFY.md](https://github.com/${REPOSITORY}/releases/download/${VERSION_TAG}/VERIFY.md) for detailed verification instructions.

          ### Quick Verification

          \`\`\`bash
          # Verify image signature
          cosign verify \\
            --certificate-identity-regexp=\"^https://github.com/${REPOSITORY}\" \\
            --certificate-oidc-issuer=\"https://token.actions.githubusercontent.com\" \\
            ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}

          # Verify attestation
          gh attestation verify oci://ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG} --owner ${REPOSITORY_OWNER}
          \`\`\`

          ---

          **Full Changelog**: ${SERVER_URL}/${REPOSITORY}/compare/${CHANGELOG_TEXT}" \
            ./artifacts/web/sbom.json \
            ./artifacts/web/sbom.json.bundle \
            ./artifacts/web/checksums.txt \
            ./artifacts/web/VERIFY.md \
            ./artifacts/web/provenance.intoto.jsonl \
            ./artifacts/mobile/mobile-app-release.apk \
            ./artifacts/mobile/mobile-sbom.json \
            ./artifacts/mobile/mobile-checksums.txt \
            ./artifacts/mobile/mobile-provenance.intoto.jsonl \
            --draft=false

  # Deploy to production after successful release creation
  deploy-to-production:
    name: Deploy to Production
    needs: [build-and-release, build-mobile, create-github-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_APP_ID: ${{ secrets.COOLIFY_APP_ID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail

          # Validate required Coolify configuration
          : "${COOLIFY_BASE_URL:?COOLIFY_BASE_URL secret is required}"
          : "${COOLIFY_APP_ID:?COOLIFY_APP_ID secret is required}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN secret is required}"

          echo "::add-mask::$COOLIFY_API_TOKEN"
          echo "::add-mask::$COOLIFY_BASE_URL"
          echo "::add-mask::$COOLIFY_APP_ID"

          VERSION="${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}"
          echo "Deploying version ${VERSION} to Coolify"
          echo "Note: Ensure Coolify is configured to pull the versioned tag (e.g., ${VERSION})"

          curl --fail-with-body --silent --show-error \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_APP_ID" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"

          echo "✓ Deployment triggered successfully"
