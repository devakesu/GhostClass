name: Tests

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint & SonarJS Audit
        # Fails the pipeline if there is even a single warning or error
        run: npx eslint . --max-warnings=0

      - name: TypeScript Compiler Check
        # Verifies type safety without outputting compiled files
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Mock environment variables for E2E tests
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CRON_SECRET: "test-cron-secret"
      NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "test-anon-key"
      SUPABASE_SECRET_KEY: "test-service-role-key"
      UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "test-token"
      PROXY_RATE_LIMIT_REQUESTS: "120"
      PROXY_RATE_LIMIT_WINDOW: "60"
      BREVO_API_KEY: "test-brevo-key"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x000000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      JWE_PRIVATE_KEY: "test-jwe-private-key-pem"
      NEXT_PUBLIC_APP_NAME: "GhostClass"
      NEXT_PUBLIC_APP_VERSION: "3.0.8"
      MIN_APP_VERSION: "3.0.8"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8080"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_DOMAIN: "localhost"
      NEXT_PUBLIC_APP_EMAIL: "@localhost.com"
      SENTRY_AUTH_TOKEN: "test-sentry-token"
      NEXT_PUBLIC_SENTRY_DSN: "https://test@sentry.io/123456"
      GOOGLE_SERVICE_ACCOUNT_JSON: '{"project_id":"test","private_key":"test","client_email":"test"}'
      ENFORCE_APP_CHECK: "false"
      NEXT_PUBLIC_ANDROID_PACKAGE_NAME: "com.test.app"
      FIREBASE_APP_ID_ANDROID: "1:123:android:abc"
      FIREBASE_APP_ID_IOS: "1:123:ios:abc"
      NODE_ENV: "test"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Chromium only
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Chromium dependencies (cache hit)
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run E2E tests (Chromium only)
        run: npm run test:e2e -- --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
