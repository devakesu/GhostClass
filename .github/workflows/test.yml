name: Tests

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify mobile endpoint security wrapping
        run: npm run check:mobile-security

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      # Mock environment variables for E2E tests
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CRON_SECRET: "test-cron-secret"
      NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "test-anon-key"
      SUPABASE_SECRET_KEY: "test-service-role-key"
      UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "test-token"
      PROXY_RATE_LIMIT_REQUESTS: "120"
      PROXY_RATE_LIMIT_WINDOW: "60"
      BREVO_API_KEY: "test-brevo-key"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x000000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      REQUEST_PRIVATE_KEY: "LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1DNENBUUF3QlFZREsyVndCQ0lFSUh4NG5sS1JxbStxMFRiL0xLWEFjNStmUEh0WXZabndUODJ5Tld3amIwbUUKLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQ==" # Mock Ed25519 PEM
      REQUEST_PUBLIC_KEY: "LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0KTUNvd0JRWURLMlZ3QXlFQU5pUEFzVnJINjM4MElGSEJmSkgvelhxSTdoWnhhNmFXdmd5TVUvZzVpZjg9Ci0tLS0tRU5EIFBVQkxJQyBLRVktLS0tLQ==" # Mock Ed25519 PEM
      JWE_PRIVATE_KEY: "test-jwe-private-key-pem"
      MOBILE_API_SECRET: "test-mobile-api-secret"
      NEXT_PUBLIC_APP_NAME: "GhostClass"
      NEXT_PUBLIC_APP_VERSION: "1.9.0"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8080"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_DOMAIN: "localhost"
      NEXT_PUBLIC_APP_EMAIL: "@localhost.com"
      SENTRY_AUTH_TOKEN: "test-sentry-token"
      NEXT_PUBLIC_SENTRY_DSN: "https://test@sentry.io/123456"
      GOOGLE_SERVICE_ACCOUNT_JSON: '{"project_id":"test","private_key":"test","client_email":"test"}'
      ENFORCE_APP_CHECK: "false"
      NEXT_PUBLIC_ANDROID_PACKAGE_NAME: "com.test.app"
      PLAY_INTEGRITY_PROJECT_NUMBER: "123456789"
      FIREBASE_APP_ID_ANDROID: "1:123:android:abc"
      FIREBASE_APP_ID_IOS: "1:123:ios:abc"
      NODE_ENV: "test"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Chromium only
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Chromium dependencies (cache hit)
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run E2E tests (Chromium only)
        run: npm run test:e2e -- --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
