# NOTE: This file contains template variables (e.g., ${NEXT_PUBLIC_APP_EMAIL}, ${NEXT_PUBLIC_APP_URL})
# that are substituted at request time by src/app/api/openapi/route.ts.
# Do NOT serve this file directly (e.g., via the static /api-docs/openapi.yaml path) as the
# placeholders will be returned literally. Always use the /api/openapi endpoint instead.
openapi: 3.1.0

info:
  title: GhostClass API
  version: 4.4.9
  description: |
    **GhostClass API** provides endpoints for authentication, profile synchronization,
    attendance integrations with EzyGo, telemetry, and build provenance.

    ## Authentication

    The API supports two authentication methods:

    1. **Bearer Token (CRON_SECRET)**: For automated cron jobs
       - Add `Authorization: Bearer <CRON_SECRET>` header
       - Used by automated sync processes

    2. **Session Cookie (SupabaseAuth)**: For authenticated users
       - Automatically included when logged in through the web interface
       - Managed by Supabase Auth

    ## Rate Limiting

    All endpoints are rate-limited to prevent abuse:

    - `/api/auth/save-token` & `/api/cron/sync`: Configurable via environment variables
    - `/api/backend/*`: Configurable via `PROXY_RATE_LIMIT_REQUESTS` and `PROXY_RATE_LIMIT_WINDOW`
    - Contact Form (Server Action): Configurable via environment variables

    Rate limit information is returned in response headers:
    - `X-RateLimit-Limit`: Maximum requests allowed
    - `X-RateLimit-Remaining`: Remaining requests in current window
    - `X-RateLimit-Reset`: Unix timestamp when limit resets

    ## Base URLs

    - Production: Configured via `NEXT_PUBLIC_APP_URL`
    - Development: `http://localhost:3000`

    ## Error Handling

    All error responses follow a consistent format with appropriate HTTP status codes and descriptive messages.

  contact:
    name: GhostClass Support
    email: "contact${NEXT_PUBLIC_APP_EMAIL}"
    url: ${NEXT_PUBLIC_GITHUB_URL}

  license:
    name: GPL-3.0
    url: ${NEXT_PUBLIC_GITHUB_URL}/blob/main/LICENSE

servers:
  - url: ${NEXT_PUBLIC_APP_URL}
    description: Production
  - url: https://localhost:3000
    description: Development (HTTPS)
  - url: http://localhost:3000
    description: Development (HTTP)

tags:
  - name: Authentication
    description: Endpoints for managing EzyGo authentication tokens
  - name: Mobile
    description: Mobile-first authenticated endpoints and JWE-secured bridge APIs
  - name: Security
    description: Security endpoints for CSRF protection
  - name: Sync
    description: Endpoints for synchronizing attendance data with EzyGo
  - name: Proxy
    description: Secure backend proxy and pass-through endpoints for EzyGo APIs
  - name: Health
    description: System health and status endpoints
  - name: Analytics
    description: Server-side analytics event forwarding
  - name: Reporting
    description: Browser-generated violation and telemetry reports
  - name: Profile
    description: User profile management
  - name: Keys
    description: Public key discovery endpoints for JWE/JWKS
  - name: Documentation
    description: OpenAPI and API reference endpoints
  - name: Provenance
    description: Build provenance and version metadata

paths:
  /api/auth/save-token:
    post:
      tags:
        - Authentication
      summary: Save EzyGo authentication token
      security: [] # No authentication required for this endpoint
      description: |
        Saves the EzyGo JWT authentication token and establishes a secure session for the user.

        **What it does:**
        - Validates the EzyGo token by verifying with EzyGo API
        - Creates or retrieves a Supabase authentication account (ghost login)
        - Encrypts and stores the token securely in the database
        - Establishes a session cookie for subsequent authenticated requests

        **Multi-Device Support:**
        - Uses canonical password pattern for persistent authentication
        - On first login: Generates and encrypts a canonical password for the user
        - On subsequent logins: Retrieves and decrypts the stored password
        - Enables concurrent sessions from multiple devices without invalidation
        - Logout on one device does not affect sessions on other devices

        **Authentication:** No authentication required (this endpoint creates authentication)

        **Rate Limiting:** Configured via AUTH_RATE_LIMIT_REQUESTS and AUTH_RATE_LIMIT_WINDOW environment variables

        **Side Effects:**
        - Creates a new user account in Supabase Auth if not exists
        - Stores encrypted token in the database
        - Stores encrypted canonical password on first login (auth_password, auth_password_iv)
        - Sets session cookies in the response

        **Use Cases:**
        - Initial user authentication from EzyGo
        - Token refresh when existing token expires
        - Multi-device login (desktop, mobile, tablet simultaneously)

      operationId: saveAuthToken

      requestBody:
        required: true
        description: EzyGo authentication token
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 2000
                  description: Valid EzyGo JWT token obtained from EzyGo authentication
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            examples:
              validToken:
                summary: Valid EzyGo token
                description: Example of a valid JWT token from EzyGo
                value:
                  # trivy:ignore:jwt-token
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwidXNlcm5hbWUiOiJzdHVkZW50MTIzIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"

      responses:
        "200":
          description: Token successfully saved and session established
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
              examples:
                success:
                  summary: Successful authentication
                  value:
                    success: true

        "400":
          description: Bad request - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                missingToken:
                  summary: Token not provided
                  value:
                    message: "Missing credentials"

        "401":
          description: Unauthorized - Token verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidToken:
                  summary: Invalid or expired token
                  value:
                    message: "Invalid or expired token"
                verificationFailed:
                  summary: Could not verify user identity
                  value:
                    message: "Could not verify user identity"

        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Maximum number of requests allowed in the time window (from AUTH_RATE_LIMIT_REQUESTS)
              example: 5
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Number of requests remaining in current window
              example: 0
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when the rate limit resets
              example: 1706108400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
              examples:
                tooManyRequests:
                  summary: Rate limit exceeded
                  value:
                    error: "Too many requests. Slow down!"
                    retryAfter: 900

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                serverError:
                  summary: Failed to establish session
                  value:
                    message: "Failed to establish secure session"

  /api/csrf:
    get:
      tags:
        - Security
      summary: Get CSRF token
      security: [] # No authentication required
      description: |
        Retrieves a CSRF token for use in subsequent authenticated requests. The token is automatically set as a cookie and returned in the response.

        **What it does:**
        - Generates a new CSRF token if one doesn't exist
        - Sets the token as a cookie in the response
        - Returns the token value for client-side use

        **Authentication:** None required

        **Rate Limiting:** Standard rate limiting applies

        **Use Cases:**
        - Initialize CSRF protection before making authenticated requests
        - Retrieve current CSRF token for client-side operations

      operationId: getCsrfToken

      responses:
        "200":
          description: CSRF token retrieved successfully
          headers:
            Set-Cookie:
              schema:
                type: string
              description: CSRF token cookie
              example: csrf_token=abc123...; Path=/; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The CSRF token value
                    example: "abc123def456..."
                  message:
                    type: string
                    description: Success message
                    example: "CSRF token initialized successfully"
              examples:
                success:
                  summary: Token retrieved
                  value:
                    token: "abc123def456ghi789jkl012mno345pqr678stu901vwx234yz"
                    message: "CSRF token initialized successfully"

    post:
      tags:
        - Security
      summary: Regenerate CSRF token
      security: [] # No authentication required
      description: |
        Explicitly regenerates the CSRF token, replacing any existing one.
        Useful after privilege escalation or when extra rotation is desired.

        **Authentication:** None required

        **Rate Limiting:** Configured via AUTH_RATE_LIMIT_REQUESTS / AUTH_RATE_LIMIT_WINDOW

      operationId: regenerateCsrfToken

      responses:
        "200":
          description: New CSRF token generated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Updated CSRF token cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The new CSRF token value
                  message:
                    type: string
                    description: Success message
              examples:
                success:
                  summary: Token regenerated
                  value:
                    token: "new123abc456def789..."
                    message: "CSRF token refreshed successfully"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
        "500":
          description: Unable to determine client IP or internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/security/attestation:
    get:
      tags:
        - Security
        - Mobile
      summary: Get decoded attestation details
      security: []
      description: |
        Returns the decoded security attestation details for the current request's Firebase App Check token.
        Used by the mobile app for troubleshooting, transparency, and verifying app integrity.
      operationId: getAttestationDetails
      responses:
        "200":
          description: Attestation details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    description: Whether the App Check token is valid
                  criticalRisk:
                    type: boolean
                    description: Whether a critical integrity risk was detected
                  appCheck:
                    type: boolean
                    description: Alias for verified
                  appCheckCriticalRisk:
                    type: boolean
                    description: Alias for criticalRisk
                  appCheckError:
                    type: string
                    nullable: true
                    description: Error message if verification failed
                  appId:
                    type: string
                    nullable: true
                    description: The Firebase App ID associated with the token
                  details:
                    type: object
                    description: Non-sensitive claims and metadata extracted from the token
                  enforced:
                    type: boolean
                    description: Whether App Check verification is currently enforced on the server
                  reason:
                    type: string
                    description: User-friendly explanation of the status
                  action:
                    type: string
                    description: Recommended action if verification failed
                  latestVersion:
                    type: string
                    description: Latest available version of the app
                  minVersion:
                    type: string
                    description: Minimum supported version of the app
                  type:
                    type: string
                    example: "security"
                  timestamp:
                    type: string
                    format: date-time

  /api/logout:
    post:
      tags:
        - Authentication
      summary: Logout and clear session
      security:
        - SupabaseAuth: []
      description: |
        Clears authentication cookies and ends the user session.

        **What it does:**
        - Removes authentication token cookie
        - Removes CSRF token cookie
        - Invalidates the session

        **Authentication:** Session cookie (automatically cleared)

        **Rate Limiting:** None

        **Use Cases:**
        - User logout
        - Session termination

      operationId: logout

      responses:
        "200":
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
              examples:
                success:
                  summary: Logout successful
                  value:
                    ok: true

  /api/cron/sync:
    get:
      tags:
        - Sync
      summary: Sync attendance data with EzyGo
      description: |
        Synchronizes attendance records from EzyGo with the local database. Supports both automated cron jobs and authenticated user-initiated syncs.

        **What it does:**
        - Fetches latest attendance data from EzyGo API
        - Compares with local tracking records
        - Detects and resolves conflicts (course mismatches, attendance discrepancies)
        - Sends email notifications for conflicts
        - Updates sync timestamps

        **Authentication:** 
        - **Option 1 (Cron)**: Bearer token with CRON_SECRET in Authorization header
        - **Option 2 (Users)**: Valid session cookie (authenticated users)

        **Rate Limiting:** Configured via RATE_LIMIT_REQUESTS and RATE_LIMIT_WINDOW environment variables

        **Side Effects:**
        - Deletes verified/matched attendance records
        - Updates conflicted records with 'correction' status
        - Creates notifications in the database
        - Sends email alerts for attendance conflicts
        - Updates `last_synced_at` timestamp for users

        **Use Cases:**
        - Automated daily/hourly sync via cron job
        - Manual sync triggered by users from dashboard
        - Batch sync for multiple users (cron only)
        - Single user sync with optional username filter

      operationId: syncAttendance

      security:
        - BearerAuth: []
        - SupabaseAuth: []

      parameters:
        - name: username
          in: query
          required: false
          description: |
            Filter sync to a specific user by username. Only applicable when using Bearer token authentication (cron mode).

            - If provided with cron auth: syncs only the specified user
            - If omitted with cron auth: syncs up to 10 least-recently-synced users
            - Ignored for authenticated user requests (always syncs the current user)
          schema:
            type: string
            example: "student123"

      responses:
        "200":
          description: Sync completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether sync operation completed successfully
                    example: true
                  processed:
                    type: integer
                    description: Number of users processed
                    example: 5
                  deletions:
                    type: integer
                    description: Number of tracking records deleted (verified/matched)
                    example: 23
                  conflicts:
                    type: integer
                    description: Number of attendance conflicts detected
                    example: 2
                  updates:
                    type: integer
                    description: Number of records updated to 'correction' status
                    example: 2
                  errors:
                    type: integer
                    description: Number of users that failed to sync
                    example: 0
              examples:
                successfulSync:
                  summary: Successful sync with multiple users
                  value:
                    success: true
                    processed: 5
                    deletions: 23
                    conflicts: 2
                    updates: 2
                    errors: 0
                noUsers:
                  summary: No eligible users to sync
                  value:
                    success: true
                    processed: 0
                    deletions: 0
                    conflicts: 0
                    updates: 0
                    errors: 0

        "401":
          description: Unauthorized - Invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: Not authenticated
                  value:
                    message: "Unauthorized"

        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when the rate limit resets
              example: 1706108460
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
              examples:
                tooManyRequests:
                  summary: Rate limit exceeded
                  value:
                    error: "Too many requests"
                    retryAfter: 60

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                serverError:
                  summary: Configuration error
                  value:
                    error: "Server configuration error: NEXT_PUBLIC_APP_URL is not set"

  /api/analytics/track:
    post:
      tags:
        - Analytics
      summary: Track a server-side analytics event
      security: []
      description: |
        Proxies GA4 Measurement Protocol events through the server so ad blockers
        do not suppress them. Validates event shapes, sanitises values to GA4 limits,
        and enforces origin and rate-limit guards before forwarding to GA4.

        **Authentication:** None required

        **Rate Limiting:** Configured via RATE_LIMIT_REQUESTS / RATE_LIMIT_WINDOW

      operationId: trackAnalyticsEvent

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientId
                - events
              properties:
                clientId:
                  type: string
                  maxLength: 100
                  description: GA4 client ID in `timestamp.randomhex` format
                  example: "1706108400.a1b2c3d4"
                events:
                  type: array
                  maxItems: 25
                  description: Up to 25 GA4 events per request
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        maxLength: 40
                        description: Event name (lowercase, underscores, digits only)
                      params:
                        type: object
                        description: Arbitrary GA4 event parameters
                        additionalProperties:
                          oneOf:
                            - type: string
                            - type: number
                            - type: boolean
                userProperties:
                  type: object
                  description: Optional GA4 user properties (key → string value)
                  additionalProperties:
                    type: string

      responses:
        "200":
          description: Events forwarded to GA4
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          description: Validation error (bad clientId, malformed events, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden – request origin not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/attendance/summary-batch:
    post:
      summary: Batch fetch attendance summaries
      description: |
        Retrieves attendance summaries for multiple courses in a single request.
        Optimized for dashboard card views to avoid N+1 network requests.

        Requires Firebase App Check and JWE encryption.
      tags:
        - Attendance
      security:
        - SupabaseAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courses
              properties:
                courses:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - code
                    properties:
                      id:
                        type: integer
                      code:
                        type: string
                      name:
                        type: string
      responses:
        "200":
          description: Batch summary data
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/CourseDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many requests
          content:
            application/json:
                $ref: "#/components/schemas/RateLimitError"

  /api/courses/add:
    post:
      tags:
        - Mobile
      summary: Add a new course to class lineup
      description: |
        Adds a new course to the user's class lineup.
        Primarily used by the mobile app to sync or manually add a course.
      operationId: addCourse
      security:
        - SupabaseAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseCode
                - courseName
              properties:
                courseCode:
                  type: string
                  description: The code of the course (e.g. CS101)
                  example: "CS101"
                courseName:
                  type: string
                  description: The name of the course
                  example: "Introduction to Computer Science"
      responses:
        "201":
          description: Course added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Course added successfully"
        "400":
          description: Bad request - Missing required fields or class association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict - Course already exists in the class lineup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed - Invalid field formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
 
  /api/instructors/upsert:
    post:
      tags:
        - Mobile
      summary: Save or update course instructor
      description: |
        Saves or updates instructor mapping for a specific course, semester, and academic year in the user's class.
      operationId: upsertInstructor
      security:
        - SupabaseAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseCode
                - instructorName
              properties:
                courseCode:
                  type: string
                  example: "CS101"
                instructorName:
                  type: string
                  example: "Dr. John Doe"
      responses:
        "200":
          description: Instructor saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Instructor saved successfully"
        "400":
          description: Bad request - Missing required fields or class association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed - Invalid field formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/scores/batch:
    post:
      tags:
        - Proxy
        - Mobile
      summary: Batch fetch exam questions and answers
      description: |
        Fetches exam questions and graded answers for multiple exams in parallel.
        Optimized for mobile dashboard to replace multiple individual API calls.
      operationId: batchFetchScores
      security:
        - SupabaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - examIds
              properties:
                examIds:
                  type: array
                  maxItems: 25
                  description: Array of exam IDs to fetch details for
                  items:
                    type: integer
                  example: [123, 456]
      responses:
        "200":
          description: Batch exam details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    questions:
                      type: array
                      items:
                        $ref: "#/components/schemas/ExamQuestion"
                    answers:
                      type: array
                      items:
                        $ref: "#/components/schemas/ExamAnswer"
                    error:
                      type: string
                      nullable: true
        "400":
          description: Bad request - Missing IP, invalid format, or invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid session or missing EzyGo token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/csp-report:
    post:
      tags:
        - Reporting
      summary: Receive CSP violation reports
      security: []
      description: |
        Browser endpoint for Content-Security-Policy violation reports.
        Accepts both legacy `application/csp-report` (report-uri directive) and
        modern `application/reports+json` (Reporting API v1) payloads.
        Always returns **204 No Content** so the browser does not retry.
        Body is capped at **8 KB** to prevent abuse on this unauthenticated endpoint.

        **Authentication:** None required (reports are sent automatically by browsers)

      operationId: receiveCspReport

      requestBody:
        required: true
        content:
          application/csp-report:
            schema:
              type: object
              description: "Legacy CSP report wrapped in a csp-report envelope object"
          application/reports+json:
            schema:
              type: array
              description: Reporting API v1 array of report objects
              items:
                type: object

      responses:
        "204":
          description: Report received and logged (browser should not retry)
        "400":
          description: Invalid Content-Length header value
        "413":
          description: Payload too large (exceeds 8 KB limit)
        "415":
          description: Unsupported content type

  /api/health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      security: [] # No authentication required for health checks
      description: |
        Returns the health status of the API service. Used for monitoring and uptime checks.

        **What it does:**
        - Confirms the API is responsive
        - Returns current version information
        - Provides timestamp for monitoring

        **Authentication:** None required

        **Rate Limiting:** None (health checks should always be available)

        **Use Cases:**
        - Monitoring tools and uptime checkers
        - Load balancer health checks
        - Deployment verification

      operationId: healthCheck

      responses:
        "200":
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                    description: Health status of the service
                    example: "ok"
                  version:
                    type: string
                    description: Current version of the application
                    example: "1.0.0"
                  timestamp:
                    type: string
                    format: date-time
                    description: Current server timestamp in ISO 8601 format
                    example: "2026-01-24T20:52:27.674Z"
              examples:
                healthy:
                  summary: Service is healthy
                  value:
                    status: "ok"
                    version: "1.0.0"
                    timestamp: "2026-01-24T20:52:27.674Z"

  /api/health/ezygo:
    get:
      tags:
        - Health
      summary: EzyGo integration health check
      security: []
      description: |
        Returns health status of the EzyGo API integration including circuit breaker
        and rate-limiter state. In **development/test** environments the response
        includes detailed metrics (active requests, queue length, CB state).
        In **production** only `status` and `timestamp` are returned.

        Returns HTTP **503** when the circuit breaker is open.

      operationId: healthCheckEzygo

      responses:
        "200":
          description: EzyGo integration healthy or degraded
          headers:
            Cache-Control:
              schema:
                type: string
              example: "no-store, max-age=0"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
              examples:
                healthy:
                  summary: Circuit closed, no queue backlog
                  value:
                    status: healthy
                    timestamp: "2026-02-01T12:00:00.000Z"
                degraded:
                  summary: Requests queuing up
                  value:
                    status: degraded
                    timestamp: "2026-02-01T12:00:00.000Z"
        "503":
          description: Circuit breaker open – upstream EzyGo unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unhealthy]
                  timestamp:
                    type: string
                    format: date-time

  /api/profile:
    get:
      tags:
        - Profile
      summary: Fetch user profile
      security:
        - SupabaseAuth: []
      description: |
        Returns the current user's profile data from the local database, soft-synced
        with EzyGo. PII fields (`phone`, `gender`, `birth_date`) are AES-256-GCM
        encrypted at rest; the server decrypts them before responding.

        **Full Bundle:** This endpoint returns an "uber-bundle" containing:
        - Basic profile info
        - Academic context (current_semester, current_year)
        - User settings (bunk calculator, target percentage, disabled courses)
        - Terms compliance status
        - Auth bridge token (decrypted ezygo_token)

        **Origin validation:** In production, requests must include a matching `Origin`
        header (or `Sec-Fetch-Site: same-origin`). Cross-site requests are rejected
        with 400/403 as defence-in-depth against CSRF on this read path.

      operationId: getProfile

      responses:
        "200":
          description: Profile returned successfully
          headers:
            Cache-Control:
              schema:
                type: string
              example: "no-store, max-age=0"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Origin header missing (and Sec-Fetch-Site is not same-origin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Origin not allowed (cross-site request rejected in production)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags:
        - Profile
      summary: Update user profile
      security:
        - SupabaseAuth: []
      description: |
        Updates user-editable profile fields. PII values (`gender`, `birth_date`) are
        AES-256-GCM encrypted before being written to the database.

        **CSRF:** Requires the `x-csrf-token` request header.

        **Validation:** `first_name` is required (min 2 chars). All other fields
        are optional; omitting an optional field does **not** clear it.

      operationId: updateProfile

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
              properties:
                first_name:
                  type: string
                  minLength: 2
                  example: "Aditya"
                last_name:
                  type: string
                  nullable: true
                  example: "Kumar"
                gender:
                  type: string
                  enum: [male, female, other]
                  nullable: true
                birth_date:
                  type: string
                  format: date
                  nullable: true
                  example: "2003-08-15"

      responses:
        "200":
          description: Profile updated; returns saved plaintext values
          content:
            application/json:
              schema:
                type: object
                properties:
                  first_name:
                    type: string
                  last_name:
                    type: string
                    nullable: true
                  gender:
                    type: string
                    nullable: true
                  birth_date:
                    type: string
                    nullable: true
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Validation failed"
                  details:
                    type: object
        "500":
          description: Database update failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/provenance:
    get:
      tags:
        - Provenance
      summary: Build provenance and version metadata
      security: []
      description: |
        Returns build provenance metadata: commit SHA, app version, image digest,
        audit and signature status, and build timestamp.

        Extended CI metadata (`github_run_id`, `github_run_number`, `github_repo`)
        is included only when the request presents
        `Accept: application/vnd.ghostclass.provenance+json`.

        Responses are **never cached** (`Cache-Control: no-store`).

      operationId: getProvenance

      parameters:
        - name: Accept
          in: header
          required: false
          description: |
            Pass `application/vnd.ghostclass.provenance+json` to receive extended
            CI/build metadata in addition to the base payload.
          schema:
            type: string

      responses:
        "200":
          description: Provenance metadata
          headers:
            Cache-Control:
              schema:
                type: string
              example: "no-store, max-age=0"
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit:
                    type: string
                    description: Commit SHA (legacy alias for commit_sha)
                  commit_sha:
                    type: string
                  build_id:
                    type: string
                  app_version:
                    type: string
                  image_digest:
                    type: string
                  container:
                    type: boolean
                  timestamp:
                    type: string
                    format: date-time
                  audit_status:
                    type: string
                  signature_status:
                    type: string
              examples:
                base:
                  summary: Standard production payload
                  value:
                    commit: "a1b2c3d"
                    commit_sha: "a1b2c3d"
                    build_id: "123456789"
                    app_version: "1.9.5"
                    image_digest: "sha256:abc123..."
                    container: true
                    timestamp: "2026-02-01T10:00:00.000Z"
                    audit_status: "PASSED"
                    signature_status: "SIGNED"

  /api/openapi:
    get:
      tags:
        - Documentation
      summary: Get resolved OpenAPI YAML
      security: []
      description: |
        Returns the OpenAPI YAML document with `${NEXT_PUBLIC_*}` template tokens
        resolved at request time.
      operationId: getOpenApiSpec
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

  /api/.well-known/jwks.json:
    get:
      tags:
        - Keys
      summary: Get JWKS public keys
      security: []
      description: |
        Returns the JSON Web Key Set (JWKS) used by clients to discover
        active public keys for cryptographic operations.
      operationId: getJwks
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/jwk-set+json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
        "500":
          description: Failed to fetch keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/sync:
    post:
      tags:
        - Authentication
        - Mobile
      summary: Self-heal authentication state
      description: |
        Attempts to refresh Supabase session cookies and restore EzyGo auth token
        from server-side storage after client-side auth/session drift.
      operationId: syncAuth
      responses:
        "200":
          description: Sync attempt completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  terminal:
                    type: boolean
        "401":
          description: Session expired and cannot be recovered
          headers:
            x-terminal-auth:
              schema:
                type: string
              description: Present and set to `true` when re-authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/register-fcm:
    post:
      tags:
        - Authentication
        - Mobile
      summary: Register mobile FCM push token
      description: |
        Registers or updates the Firebase Cloud Messaging (FCM) push token for the authenticated user.
        Enables sending push notifications to the user's mobile device.
      operationId: registerFcmToken
      security:
        - SupabaseAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcm_token
              properties:
                fcm_token:
                  type: string
                  description: The Firebase Cloud Messaging registration token
                  example: "bk3RNwXXeDY:AP91bH..."
      responses:
        "200":
          description: FCM token registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          description: Bad request - Missing IP or invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid session or bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed - Empty token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/contact:
    post:
      tags:
        - Mobile
      summary: Submit contact/support message
      description: |
        Submits a contact message through the shared contact service.
        Supports both authenticated and guest submissions.
      operationId: submitContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Message accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
        "400":
          description: Validation or payload error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Contact processing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/user/accept-terms:
    post:
      tags:
        - Mobile
      summary: Accept terms for mobile user
      description: |
        Updates `terms_version` and `terms_accepted_at` for authenticated mobile users.
      operationId: acceptTermsMobile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: string
      responses:
        "200":
          description: Terms acceptance stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  version:
                    type: string
        "400":
          description: Missing version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to update terms acceptance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/backend/{path}:
    description: |
      Proxies requests to EzyGo backend endpoints.

      **Rate Limiting:** Configured via `PROXY_RATE_LIMIT_REQUESTS` and `PROXY_RATE_LIMIT_WINDOW`.
    parameters:
      - name: path
        in: path
        required: true
        description: Forwarded EzyGo backend path segment(s)
        schema:
          type: string
    get:
      tags:
        - Proxy
      summary: Proxy GET request to EzyGo backend
      operationId: proxyGet
      responses:
        "200":
          description: Proxied response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "4XX":
          description: Client error from proxy or upstream
        "5XX":
          description: Upstream/proxy failure
    post:
      tags:
        - Proxy
      summary: Proxy POST request to EzyGo backend
      operationId: proxyPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Proxied response
        "4XX":
          description: Client error from proxy or upstream
        "5XX":
          description: Upstream/proxy failure
    put:
      tags:
        - Proxy
      summary: Proxy PUT request to EzyGo backend
      operationId: proxyPut
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Proxied response
        "4XX":
          description: Client error from proxy or upstream
        "5XX":
          description: Upstream/proxy failure
    patch:
      tags:
        - Proxy
      summary: Proxy PATCH request to EzyGo backend
      operationId: proxyPatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Proxied response
        "4XX":
          description: Client error from proxy or upstream
        "5XX":
          description: Upstream/proxy failure
    delete:
      tags:
        - Proxy
      summary: Proxy DELETE request to EzyGo backend
      operationId: proxyDelete
      responses:
        "200":
          description: Proxied response
        "4XX":
          description: Client error from proxy or upstream
        "5XX":
          description: Upstream/proxy failure
    head:
      tags:
        - Proxy
      summary: Proxy HEAD request to EzyGo backend
      operationId: proxyHead
      responses:
        "200":
          description: Proxied response
        "4XX":
          description: Client error from proxy or upstream
        "5XX":
          description: Upstream/proxy failure

components:
  schemas:
    CourseDetail:
      type: object
      properties:
        present:
          type: integer
        absent:
          type: integer
        total:
          type: integer
        percentage:
          type: number
        course:
          type: object
          properties:
            id:
              oneOf:
                - type: integer
                - type: string
            name:
              type: string
            code:
              type: string

    UserProfile:
      type: object
      description: Decrypted user profile data (PII fields returned as plaintext)
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
          description: EzyGo user ID
        username:
          type: string
          example: "student123"
        email:
          type: string
          format: email
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: Decrypted phone number (AES-256-GCM at rest)
        gender:
          type: string
          nullable: true
          description: Decrypted gender (AES-256-GCM at rest)
        birth_date:
          type: string
          nullable: true
          description: Decrypted birth date in YYYY-MM-DD format (AES-256-GCM at rest)
        avatar_url:
          type: string
          nullable: true
        terms_version:
          type: string
          nullable: true
        terms_accepted_at:
          type: string
          format: date-time
          nullable: true
        current_semester:
          type: string
          nullable: true
        current_year:
          type: string
          nullable: true
        ezygo_token:
          type: string
          nullable: true
        settings:
          type: object
          properties:
            bunk_calculator_enabled:
              type: boolean
            target_percentage:
              type: integer
            disabled_courses:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: string

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong
        message:
          type: string
          description: Detailed error message
      example:
        error: "Internal Server Error"

    ValidationError:
      type: object
      properties:
        message:
          type: string
          description: Validation error message
        errors:
          type: array
          description: List of validation errors (if multiple fields failed)
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that failed validation
              message:
                type: string
                description: Validation error message for this field
      example:
        message: "Missing credentials"

    RateLimitError:
      type: object
      properties:
        error:
          type: string
          description: Rate limit error message
          example: "Too many requests. Slow down!"
        retryAfter:
          type: integer
          description: Unix timestamp (in seconds) when the rate limit resets. Matches the `X-RateLimit-Reset` header.
          example: 1735689600
      required:
        - error
        - retryAfter

    ExamQuestion:
      type: object
      properties:
        id:
          type: integer
        question_no:
          type: string
        name:
          type: string
        maximum_mark:
          type: string
        module_id:
          type: integer
        exam_id:
          type: integer
        institution_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExamAnswer:
      type: object
      properties:
        id:
          type: integer
        answer:
          type: string
          nullable: true
        score:
          type: string
          nullable: true
        choice_id:
          type: integer
          nullable: true
        examquestion_id:
          type: integer
        student_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication using CRON_SECRET environment variable.
        Used for automated cron jobs.

        Example: `Authorization: Bearer <CRON_SECRET>`

    SupabaseAuth:
      type: apiKey
      in: cookie
      name: sb-*
      description: |
        Session cookie authentication managed by Supabase Auth.
        Automatically included when users are logged in through the web interface.
        Cookie names typically start with 'sb-' prefix.

externalDocs:
  description: GitHub Repository
  url: ${NEXT_PUBLIC_GITHUB_URL}
